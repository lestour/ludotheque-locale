<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Diagnostic de la ludothèque</title>
  <style>
    :root{color-scheme:light dark;font-family:Arial,sans-serif;background:#eef3f9;color:#17243a}body{margin:0}main{max-width:1120px;margin:auto;padding:24px}.panel{padding:18px;border:1px solid #cbd5e1;border-radius:16px;background:#fff;box-shadow:0 8px 24px #0002}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{margin:0 auto 0 0}button,a{font:inherit;padding:8px 12px;border:1px solid #94a3b8;border-radius:9px;background:#fff;color:inherit;text-decoration:none;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.summary div{padding:13px;border-radius:11px;background:#e8eef7;text-align:center}.summary strong{display:block;font-size:25px}.results{width:100%;border-collapse:collapse}.results th,.results td{padding:9px;border-bottom:1px solid #cbd5e1;text-align:left}.ok{color:#15803d}.fail{color:#dc2626}.running{color:#a16207}iframe{position:fixed;left:-10000px;top:-10000px;width:1000px;height:800px}@media(prefers-color-scheme:dark){:root{background:#101827;color:#eef4ff}.panel{background:#172235;border-color:#3b4b63}button,a{background:#263447;border-color:#60718a}.summary div{background:#263447}.results th,.results td{border-color:#3b4b63}.ok{color:#4ade80}.fail{color:#f87171}.running{color:#fbbf24}}
  </style>
</head>
<body><main><section class="panel"><div class="toolbar"><h1>Diagnostic local</h1><a href="../index.html">Hub</a><button id="run">Relancer tous les tests</button><button id="stress">Campagne générateurs</button></div><p>Ce diagnostic vérifie le runtime partagé, les pages, leurs scripts locaux et leur chargement dans le navigateur actuel. La campagne teste plusieurs graines reproductibles sur les générateurs les plus coûteux.</p><div class="summary"><div><strong id="passed">0</strong>réussis</div><div><strong id="failed">0</strong>échoués</div><div><strong id="pending">0</strong>restants</div></div><table class="results"><thead><tr><th>Test</th><th>État</th><th>Détail</th></tr></thead><tbody id="results"></tbody></table><iframe id="sandbox" title="Zone de test"></iframe></section></main><script src="../shared/game-runtime.js?v=12"></script><script src="../shared/music-score-parser.js?v=1"></script><script src="smoke.js?v=7"></script></body>
</html>
