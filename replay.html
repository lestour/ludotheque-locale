<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Lecteur de replay LAN</title>
  <style>
    :root{color-scheme:light dark;font-family:Arial,sans-serif;background:#f3f6fb;color:#17243a}body{margin:0}main{max-width:980px;margin:auto;padding:24px}.panel{padding:20px;border:1px solid #cbd5e1;border-radius:17px;background:#fff;box-shadow:0 8px 26px #0f172a18}.toolbar,.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar h1{margin:0 auto 0 0}button,a,input,select{font:inherit;padding:8px 11px;border:1px solid #94a3b8;border-radius:9px;background:#fff;color:inherit;text-decoration:none}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:18px 0}.summary div{padding:11px;border-radius:10px;background:#e8efff}.timeline{margin:18px 0;padding:0;list-style:none}.event{display:grid;grid-template-columns:72px 115px minmax(0,1fr);gap:10px;padding:10px;border-bottom:1px solid #dbe3ee}.event.current{border-radius:9px;background:#fef3c7;outline:2px solid #f59e0b}.event code{white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:28px;text-align:center;color:#64748b}@media(prefers-color-scheme:dark){:root{background:#101827;color:#e8eef8}.panel{background:#172235;border-color:#465977}.summary div{background:#263447}.event{border-color:#34445e}.event.current{background:#713f12}button,a,input,select{background:#263447;border-color:#60718a}}@media(max-width:620px){main{padding:10px}.event{grid-template-columns:58px minmax(0,1fr)}.event code{grid-column:1/-1}}
  </style>
</head>
<body><main><section class="panel"><div class="toolbar"><h1>Lecteur de replay LAN</h1><a href="index.html">Hub</a><label>Importer <input id="file" type="file" accept="application/json,.json"></label></div><p id="status">Chargez un replay JSON exporté depuis un salon LAN.</p><div id="summary" class="summary" hidden></div><div class="controls"><button id="previous" disabled>← Précédent</button><button id="play" disabled>Lecture</button><button id="next" disabled>Suivant →</button><label>Vitesse <select id="speed"><option value="2">× 0,5</option><option value="1" selected>× 1</option><option value="0.5">× 2</option><option value="0.25">× 4</option></select></label><label>Filtre <select id="filter"><option value="">Tous</option></select></label></div><ol id="timeline" class="timeline"><li class="empty">Aucun replay chargé.</li></ol></section></main><script src="shared/game-runtime.js?v=12"></script><script src="replay.js?v=1"></script></body>
</html>
