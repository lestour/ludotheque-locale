<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Puzzles logiques</title>
  <style>
    :root{color-scheme:light dark;font-family:Arial,sans-serif;background:#eef4fb;color:#17243a;--cell:clamp(40px,7vw,64px)}body{margin:0;min-height:100vh}main{max-width:1200px;margin:auto;padding:22px}.panel,.side{background:#fff;border:1px solid #cbd8eb;border-radius:16px;padding:17px;box-shadow:0 8px 24px #0f254012}.toolbar,.actions,.trace-controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}h1{margin:0 auto 0 0}button,a,select,input{font:inherit;color:inherit;background:#fff;border:1px solid #8da2c3;border-radius:9px;padding:8px 11px;text-decoration:none}button,a{cursor:pointer}button:hover,a:hover,.primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px}.play-area{min-height:540px;display:grid;place-items:center;overflow:auto;padding:12px}.side{align-self:start}.muted{color:#60728d;line-height:1.5}.status{min-height:28px;font-weight:700}.puzzle-grid,.kakuro-grid{position:relative;display:grid;gap:2px;padding:7px;background:#27466f;border-radius:12px;box-shadow:0 8px 20px #18325228}.puzzle-cell,.kakuro-cell{position:relative;display:grid;place-items:center;width:var(--cell);height:var(--cell);padding:0;border:0;border-radius:0;background:#fff;color:#17243a;font-size:clamp(18px,3vw,29px);font-weight:800}.puzzle-cell.active,.kakuro-cell.active{outline:4px solid #7c3aed;outline-offset:-4px;z-index:4}.puzzle-cell.trace-focus,.kakuro-cell.trace-focus{outline:5px solid #16a34a;outline-offset:-5px;z-index:5}.puzzle-cell.given,.kakuro-cell.given{background:#dceafe}.puzzle-cell.shaded{background:#1e293b;color:#fff}.puzzle-cell.clue,.kakuro-cell.clue{background:#26394f;color:#fff;font-size:13px}.puzzle-cell.light{background:#fff7bf}.puzzle-cell.bulb::after{content:'💡';font-size:28px}.puzzle-cell.island{background:#d8f3dc}.puzzle-cell.sea{background:#75b9ee;color:#fff}.puzzle-cell.path-a{background:#fecaca}.puzzle-cell.path-b{background:#bfdbfe}.puzzle-cell.path-c{background:#ddd6fe}.puzzle-cell.path-d{background:#bbf7d0}.puzzle-cell.path-e{background:#fde68a}.puzzle-cell.path-f{background:#a7f3d0}.puzzle-cell.path-g{background:#fbcfe8}.futoshiki-sign{position:absolute;z-index:5;color:#b45309;font-size:22px;font-weight:900;pointer-events:none;line-height:1;display:grid;place-items:center}.futoshiki-sign.vertical{font-size:22px}.keypad{display:grid;grid-template-columns:repeat(3,52px);gap:6px;justify-content:center}.keypad button{min-height:46px;padding:0;font-weight:900}.keypad .erase{grid-column:1/-1}.kakuro-clue{position:relative;background:#26394f;color:#fff;width:var(--cell);height:var(--cell)}.kakuro-clue::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49%,#94a3b8 50%,transparent 51%)}.kakuro-clue span{position:absolute;z-index:1;font-size:12px}.kakuro-clue .down{top:4px;right:5px}.kakuro-clue .right{bottom:4px;left:5px}.slither-wrap{position:relative;background:#fff;border:2px solid #31557f;border-radius:12px}.slither-cell{position:absolute;display:grid;place-items:center;border:1px solid #b6c8dd;color:#334155;font-size:20px;font-weight:800}.edge{position:absolute;z-index:3;border:0;border-radius:99px;background:#dbeafe;cursor:pointer;padding:0}.edge.active{background:#1d4ed8}.edge.trace-focus{box-shadow:0 0 0 5px #22c55e}.edge.h{height:5px}.edge.v{width:5px}.legend{display:grid;gap:8px;padding:0;list-style:none}.legend li{padding:8px;border-radius:8px;background:#eef5ff;cursor:pointer}.progress{height:10px;border-radius:99px;overflow:hidden;background:#dce8f6}.progress i{display:block;height:100%;background:#22c55e;transition:width .2s}.rules{white-space:pre-line}.trace{padding:10px;border-radius:10px;background:#f0f7ff;min-height:22px}.trace-controls[hidden]{display:none}.trace-controls input{flex:1 1 220px;min-width:140px}.trace-step-label{min-width:92px;text-align:center;font-weight:800}@media(max-width:820px){main{padding:10px}.layout{grid-template-columns:1fr}.play-area{min-height:400px}.side{order:-1}:root{--cell:clamp(36px,11vw,56px)}}@media(prefers-color-scheme:dark){:root{background:#101827;color:#e8eef8}.panel,.side{background:#172235;border-color:#445978}.muted{color:#b8c7db}button,a,select,input{background:#263447;color:#f1f5fb;border-color:#60718a}.puzzle-grid,.kakuro-grid{background:#7090b7}.puzzle-cell,.kakuro-cell{background:#e8f0fc;color:#17243a}.puzzle-cell.given,.kakuro-cell.given{background:#b8d5f5}.legend li,.trace{background:#22344e}}
  </style>
</head>
<body>
  <main><section class="panel">
    <div class="toolbar"><h1>Puzzles logiques</h1><a href="../../index.html">Hub</a><label data-options-exclude>Jeu <select id="mode"><option value="futoshiki">Futoshiki</option><option value="kakuro">Kakuro</option><option value="hidato">Hidato</option><option value="hitori">Hitori</option><option value="nurikabe">Nurikabe</option><option value="akari">Akari</option><option value="slitherlink">Slitherlink</option><option value="numberlink">Numberlink</option></select></label><label id="sizeLabel">Taille <select id="size"><option value="4">4 × 4</option><option value="5">5 × 5</option><option value="6">6 × 6</option></select></label><label>Difficulté <select id="difficulty"><option value="easy">Facile</option><option value="normal" selected>Moyen</option><option value="hard">Difficile</option><option value="expert">Extrême</option></select></label><button id="newGame">Nouvelle grille</button></div>
    <div class="layout"><section><div id="status" class="status"></div><div id="playArea" class="play-area"></div><div class="actions"><button id="check">Vérifier</button><button id="hint">Indice logique</button><button id="solveAll">Mode trace</button><button id="reset">Effacer</button><button id="abandon">Abandonner</button></div><div id="traceControls" class="trace-controls" hidden><button id="previousStep" aria-label="Étape précédente">←</button><input id="traceSlider" type="range" min="0" max="0" value="0" aria-label="Étape de résolution"><span id="traceStepLabel" class="trace-step-label">0 / 0</span><button id="nextStep">→</button><button id="closeTrace">Quitter la trace</button></div><p id="traceComment" class="trace" hidden></p><div id="keypad" class="keypad" aria-label="Pavé numérique"></div></section><aside class="side"><h2 id="title">Futoshiki</h2><p id="rules" class="muted rules"></p><div class="progress"><i id="progress"></i></div><p id="progressText" class="muted"></p><h2>Règles et exemples</h2><ul id="legend" class="legend"></ul></aside></div>
  </section></main>
  <script src="../../shared/game-runtime.js?v=12"></script>
  <script src="logic-puzzles-engine.js?v=1"></script>
  <script src="logic-puzzles.js?v=4"></script>
  <script src="../../shared/records.js?v=7"></script>
  <script src="../../shared/options-help.js?v=4" data-options-help="true"></script>
</body>
</html>
