<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Fusion 2048</title><style>
:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#eef4fb;color:#17243a;--size:4}body{margin:0}main{max-width:980px;margin:auto;padding:20px}.panel{padding:17px;border:1px solid #cbd8eb;border-radius:16px;background:#fff}.bar,.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.bar h1{margin:0 auto 0 0}button,a,select{padding:8px 11px;border:1px solid #8da2c3;border-radius:9px;background:#fff;color:inherit;font:inherit;text-decoration:none;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;margin-top:16px}.board{display:grid;grid-template-columns:repeat(var(--size),minmax(48px,88px));gap:8px;width:max-content;max-width:100%;padding:9px;border-radius:14px;background:#9aa9bd}.tile{aspect-ratio:1;display:grid;place-items:center;border-radius:9px;background:#e7edf6;color:#17243a;font-size:clamp(17px,4vw,30px);font-weight:900}.tile:not(:empty){background:hsl(calc(48 - min(var(--level),10)*4) 82% calc(92% - min(var(--level),10)*4%))}.score{font-size:22px;font-weight:900;color:#0f766e}.rules{line-height:1.55}.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:15px}.pad button{height:50px}.blank{visibility:hidden}@media(max-width:720px){main{padding:9px}.layout{grid-template-columns:1fr}.layout aside{order:-1}.board{width:100%;box-sizing:border-box;grid-template-columns:repeat(var(--size),1fr)}}@media(prefers-color-scheme:dark){:root{background:#101827;color:#edf4ff}.panel{background:#172235;border-color:#4b607d}button,a,select{background:#263447;border-color:#60718a}.tile{background:#dbe5f3;color:#17243a}.score{color:#5eead4}}
</style></head><body><main><section class="panel"><div class="bar"><h1>Fusion 2048</h1><a href="../../index.html">Hub</a><label>Taille <select id="size"><option value="4">4 × 4</option><option value="5">5 × 5</option></select></label><label>Objectif <select id="target"><option value="1024">1 024</option><option value="2048" selected>2 048</option><option value="4096">4 096</option></select></label><button id="newGame">Nouvelle partie</button><button id="undo">Annuler</button></div><div class="layout"><section><div id="status"></div><div id="board" class="board" aria-label="Grille Fusion 2048"></div><div class="pad"><span class="blank">.</span><button data-key="ArrowUp">▲</button><span class="blank">.</span><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div></section><aside><p id="score" class="score"></p><h2>Règles</h2><ul class="rules"><li>Déplacez toutes les tuiles avec les flèches ou ZQSD.</li><li>Deux valeurs identiques fusionnent une seule fois pendant un mouvement.</li><li>Atteignez l’objectif avant que la grille soit bloquée.</li></ul></aside></div></section></main><script src="../../shared/game-runtime.js?v=12"></script><script src="fusion-2048.js?v=1"></script><script src="../../shared/records.js?v=7"></script><script src="../../shared/options-help.js?v=4" data-options-help="true"></script></body></html>
