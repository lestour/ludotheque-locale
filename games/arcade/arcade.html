<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Arcade local</title>
  <style>
    :root{color-scheme:light dark;font-family:Arial,sans-serif;background:#eef3fb;color:#17243a}body{margin:0;min-height:100vh}main{max-width:1100px;margin:auto;padding:20px}.panel{background:#fff;border:1px solid #cad7eb;border-radius:18px;padding:18px;box-shadow:0 10px 30px #163b6d16}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.bar h1{margin:0 auto 0 0}button,a,select{font:inherit;color:inherit;background:#fff;border:1px solid #8ea4c5;border-radius:9px;padding:8px 11px;text-decoration:none;cursor:pointer}button:hover,a:hover,.primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8}.arcade-options{padding:6px 9px;border:1px solid #8ea4c5;border-radius:9px}.arcade-options summary{cursor:pointer;font-weight:800}.arcade-options label{display:inline-flex;gap:5px;align-items:center;margin:5px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px}.screen{display:grid;place-items:center;min-height:570px;border-radius:14px;overflow:hidden;background:#0f172a}canvas{max-width:100%;height:auto;touch-action:none}.side{align-self:start}.side h2{margin:0 0 8px}.muted{line-height:1.5;color:#5e708b}.score{font-size:20px;font-weight:800;color:#0f766e}.pad{display:grid;grid-template-columns:repeat(3,54px);gap:6px;justify-content:center;margin-top:17px}.pad button{height:48px;font-weight:900}.pad .blank{visibility:hidden}.rules{padding-left:18px;line-height:1.55}.hint{padding:10px;border-radius:9px;background:#e0edff}.status{min-height:24px;font-weight:700}@media(max-width:760px){main{padding:10px}.layout{grid-template-columns:1fr}.side{order:-1}.screen{min-height:0}.bar h1{width:100%}}@media(prefers-color-scheme:dark){:root{background:#101827;color:#e9eff9}.panel{background:#172235;border-color:#405776}.muted{color:#b6c6db}button,a,select{background:#263447;color:#edf4ff;border-color:#5a708c}.hint{background:#243b58}.score{color:#5eead4}}
  </style>
</head>
<body><main><section class="panel">
  <div class="bar"><h1>Arcade local</h1><a href="../../index.html">Hub</a><label data-options-exclude>Jeu <select id="mode"><option value="snake">Serpent</option><option value="breaker">Casse-briques</option><option value="maze">Labyrinthe</option><option value="racer">Course express</option></select></label><label>Difficulté <select id="difficulty"><option value="easy">Facile</option><option value="normal" selected>Normal</option><option value="hard">Difficile</option><option value="extreme">Extrême</option></select></label><label>Format <select id="arena"><option value="compact">Compact</option><option value="standard" selected>Standard</option><option value="large">Grand</option></select></label><label>Bonus <select id="bonus"><option value="off">Classiques</option><option value="on">Bonus actifs</option></select></label><button id="start" class="primary">Démarrer</button><button id="pause">Pause</button></div>
  <div class="layout"><section><div id="status" class="status"></div><div class="screen"><canvas id="screen" width="640" height="520" aria-label="Zone de jeu arcade"></canvas></div><div class="pad" aria-label="Commandes tactiles"><span class="blank">.</span><button data-key="ArrowUp">▲</button><span class="blank">.</span><button data-key="ArrowLeft">◀</button><button data-key=" ">●</button><button data-key="ArrowRight">▶</button><span class="blank">.</span><button data-key="ArrowDown">▼</button><span class="blank">.</span></div></section><aside class="side panel"><h2 id="gameTitle"></h2><p id="description" class="muted"></p><p class="score" id="score">Score : 0</p><div class="hint" id="controls"></div><h2>Règles</h2><ul class="rules" id="rules"></ul></aside></div>
</section></main><script src="../../shared/game-runtime.js?v=12"></script><script src="arcade.js?v=3"></script><script src="../../shared/records.js?v=7"></script><script src="../../shared/options-help.js?v=4" data-options-help="true"></script></body></html>
