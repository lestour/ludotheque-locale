<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Échecs et Dames</title>
<style>
:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#f3f6fb;color:#152238}body{margin:0;min-height:100vh}main{max-width:1050px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #d7e0ed;border-radius:16px;padding:18px;box-shadow:0 8px 24px #00000014}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}h1{margin:0 auto 0 0}button,a,select{font:inherit;color:inherit;background:#fff;border:1px solid #9baac0;border-radius:10px;padding:8px 12px;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#2447a8;color:#fff}.layout{display:grid;grid-template-columns:minmax(330px,620px) minmax(220px,1fr);gap:20px}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:6px solid #523522;box-shadow:0 8px 16px #0003}.cell{border:0;border-radius:0;padding:0;display:grid;place-items:center;font-size:clamp(31px,7vw,57px);background:#f1d9b5;color:#111827;position:relative}.cell.dark{background:#9d6c45}.cell.selected{box-shadow:inset 0 0 0 5px #7c3aed}.cell.legal::after{content:'';width:23%;aspect-ratio:1;border-radius:50%;background:#1d9d5a99}.cell.capture::after{content:'';position:absolute;inset:8%;border:4px solid #dc2626;border-radius:50%}.piece{position:relative;z-index:1;filter:drop-shadow(0 2px 1px #fff8)}.black{color:#172235;filter:drop-shadow(0 1px 1px #fff)}.checker{width:66%;aspect-ratio:1;border-radius:50%;background:#e7e5e4;border:5px solid #b8b4ad;box-sizing:border-box;box-shadow:inset 0 -7px #a09c94,0 3px 2px #0006}.checker.black{background:#263447;border-color:#111827;box-shadow:inset 0 -7px #0b1220,0 3px 2px #0006}.checker.king::after{content:'♛';font-size:68%;color:#dcae25;text-shadow:0 1px #000;position:absolute;inset:0;display:grid;place-items:center}.side{padding:14px;border:1px solid #d7e0ed;border-radius:12px;background:#f8fafc}.side h2{margin-top:0}.muted,#history{color:#61718a;line-height:1.55}.score{display:grid;grid-template-columns:1fr 1fr;gap:8px}.score div{padding:8px;background:#fff;border:1px solid #d7e0ed;border-radius:8px;text-align:center}@media(max-width:780px){.layout{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{background:#101827;color:#e8eef8}.panel,.side,.score div{background:#172235;border-color:#34445e}.muted,#history{color:#b5c1d1}button,a,select{background:#263447;color:#f1f5fb}}
</style></head>
<body><main><section class="panel"><div class="toolbar"><h1 id="title">Échecs</h1><a href="../../index.html">Hub de jeux</a><button id="newGame">Nouvelle partie</button><label class="muted">Jeu <select id="gameType"><option value="chess">Échecs</option><option value="checkers">Dames</option></select></label><label class="muted">Bot <select id="difficulty"><option value="easy">Facile</option><option value="normal" selected>Moyen</option><option value="hard">Difficile</option></select></label></div><div id="status" class="muted"></div><div class="layout"><div id="board" class="board"></div><aside class="side"><h2>Partie</h2><div id="rules" class="muted"></div><div id="score" class="score"></div><h2>Historique</h2><ul id="history"></ul></aside></div></section></main><script src="chess.js?v=3"></script></body></html>
