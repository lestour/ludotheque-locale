<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Échecs et Dames</title>
<style>
:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#f3f6fb;color:#152238}body{margin:0;min-height:100vh}main{max-width:1320px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #d7e0ed;border-radius:16px;padding:18px;box-shadow:0 8px 24px #00000014}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}h1{margin:0 auto 0 0}button,a,select{font:inherit;color:inherit;background:#fff;border:1px solid #9baac0;border-radius:10px;padding:8px 12px;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#2447a8;color:#fff}.layout{display:grid;grid-template-columns:minmax(0,760px) minmax(280px,1fr);gap:24px;align-items:start}.board-wrap{overflow:auto;padding:8px}.board{--board-size:8;--cell-size:82px;display:grid;grid-template-columns:repeat(var(--board-size),var(--cell-size));grid-template-rows:repeat(var(--board-size),var(--cell-size));width:calc(var(--board-size) * var(--cell-size));height:calc(var(--board-size) * var(--cell-size));border:6px solid #523522;box-shadow:0 8px 16px #0003;overflow:visible;margin:auto}.cell{width:var(--cell-size);height:var(--cell-size);min-width:var(--cell-size);min-height:var(--cell-size);border:0;border-radius:0;padding:0;display:grid;place-items:center;font-size:calc(var(--cell-size) * .7);background:#f1d9b5;color:#111827;position:relative;overflow:visible}.cell.dark{background:#9d6c45}.cell.selected{box-shadow:inset 0 0 0 5px #7c3aed}.cell.legal::after{content:'';width:23%;aspect-ratio:1;border-radius:50%;background:#1d9d5a99}.cell.capture::after{content:'';position:absolute;inset:8%;border:4px solid #dc2626;border-radius:50%}.piece{position:relative;z-index:1;line-height:1;filter:drop-shadow(0 2px 1px #fff8)}.black{color:#172235;filter:drop-shadow(0 1px 1px #fff)}.checker{position:relative;width:68%;aspect-ratio:1;border-radius:50%;background:#e7e5e4;border:calc(var(--cell-size) * .06) solid #b8b4ad;box-sizing:border-box;box-shadow:inset 0 calc(var(--cell-size) * -.08) #a09c94,0 3px 2px #0006}.checker.black{background:#263447;border-color:#111827;box-shadow:inset 0 calc(var(--cell-size) * -.08) #0b1220,0 3px 2px #0006}.checker.king::after{content:'♛';font-size:68%;color:#dcae25;text-shadow:0 1px #000;position:absolute;inset:0;display:grid;place-items:center}.board-motion-overlay{position:fixed;z-index:2147483000;display:grid;place-items:center;pointer-events:none;transform-origin:center}.board-motion-overlay .piece{font-size:inherit}.board-motion-overlay .checker{display:block}.cell.arriving>.piece,.cell.arriving>.checker{animation:board-arrival .5s ease-out}.board.game-win{animation:board-win .9s ease-out .44s both}.board.game-loss{animation:board-loss .62s ease-in-out .44s both}.board.game-draw{animation:board-draw .8s ease-out .44s both}.result-win,.result-loss,.result-draw{font-weight:800;padding:9px 12px;border-radius:10px;animation:result-pop .55s ease-out .36s both}.result-win{color:#087a43;background:#dcfce7}.result-loss{color:#b91c1c;background:#fee2e2}.result-draw{color:#7c3aed;background:#ede9fe}@keyframes board-arrival{0%,72%{opacity:0;transform:scale(.72)}100%{opacity:1;transform:scale(1)}}@keyframes board-win{30%{box-shadow:0 0 0 10px #22c55e88,0 16px 32px #22c55e55}65%{transform:scale(1.018)}}@keyframes board-loss{18%,55%{transform:translateX(-8px)}36%,72%{transform:translateX(8px)}100%{filter:saturate(.72)}}@keyframes board-draw{45%{box-shadow:0 0 0 8px #8b5cf688,0 14px 28px #8b5cf644}}@keyframes result-pop{45%{transform:scale(1.055)}}.side{padding:16px;border:1px solid #d7e0ed;border-radius:12px;background:#f8fafc}.side h2{margin-top:18px}.muted,#history{color:#61718a;line-height:1.55}#status.result-win{color:#087a43}#status.result-loss{color:#b91c1c}#status.result-draw{color:#7c3aed}.score{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.score div{padding:8px;background:#fff;border:1px solid #d7e0ed;border-radius:8px;text-align:center}.hidden{display:none!important}@media(max-width:1060px){.layout{grid-template-columns:1fr}.side{margin-top:18px}}@media(prefers-reduced-motion:reduce){.board-motion-overlay{display:none}.cell.arriving>.piece,.cell.arriving>.checker,.board.game-win,.board.game-loss,.board.game-draw,.result-win,.result-loss,.result-draw{animation:none}}@media(prefers-color-scheme:dark){:root{background:#101827;color:#e8eef8}.panel,.side,.score div{background:#172235;border-color:#34445e}.muted,#history{color:#b5c1d1}button,a,select{background:#263447;color:#f1f5fb}.result-win{color:#bbf7d0;background:#14532d}.result-loss{color:#fecaca;background:#7f1d1d}.result-draw{color:#ddd6fe;background:#4c1d95}}
@media(prefers-color-scheme:dark){#status.result-win{color:#bbf7d0}#status.result-loss{color:#fecaca}#status.result-draw{color:#ddd6fe}}
</style></head>
<body><main><section class="panel"><div class="toolbar"><h1 id="title">Échecs</h1><a href="../../index.html">Hub de jeux</a><button id="newGame">Nouvelle partie</button><button id="undoMove" disabled>Annuler</button><button id="redoMove" disabled>Rétablir</button><label class="muted">Jeu <select id="gameType"><option value="chess">Échecs</option><option value="checkers">Dames</option></select></label><label class="muted">Variante <select id="ruleVariant"></select></label><label id="boardSizeLabel" class="muted hidden">Plateau <select id="boardSize"><option value="8">8 × 8</option><option value="10" selected>10 × 10</option><option value="12">12 × 12</option><option value="14">14 × 14 · étendu</option></select></label><label id="promotionLabel" class="muted">Promotion <select id="promotionPiece"><option value="q">Dame</option><option value="r">Tour</option><option value="b">Fou</option><option value="n">Cavalier</option></select></label><label class="muted">Bot <select id="difficulty"><option value="easy">Facile</option><option value="normal" selected>Moyen</option><option value="hard">Difficile</option><option value="extreme">Extrême</option></select></label><label id="chainLabel" class="muted hidden"><input id="chainCaptures" type="checkbox" checked> Enchaîner les prises</label></div><div id="status" class="muted"></div><div class="layout"><div class="board-wrap"><div id="board" class="board"></div></div><aside class="side"><details open><summary><strong>Règles du jeu</strong></summary><div id="rules" class="muted"></div></details><div id="score" class="score"></div><h2>Historique</h2><ul id="history"></ul></aside></div></section></main><script src="../../shared/game-runtime.js?v=3"></script><script src="../../shared/options-help.js?v=3"></script><script src="chess.js?v=9"></script></body></html>
