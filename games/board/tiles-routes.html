<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tuiles & routes</title><style>
:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#eff6ee;color:#16271d}body{margin:0}main{max-width:1180px;margin:auto;padding:22px}.panel{background:#fff;border:1px solid #c8dfca;border-radius:17px;padding:18px;box-shadow:0 8px 24px #174c2516}.bar,.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.bar{margin-bottom:14px}.bar h1{margin:0 auto 0 0}button,a,select{font:inherit;color:inherit;background:#fff;border:1px solid #89aa8d;border-radius:9px;padding:8px 11px;text-decoration:none;cursor:pointer}button:hover,a:hover,.primary{background:#047857;color:#fff;border-color:#047857}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.board{display:grid;grid-template-columns:repeat(6,minmax(44px,75px));gap:3px;width:max-content;max-width:100%;margin:20px auto;padding:7px;background:#355b3c;border-radius:13px}.cell{aspect-ratio:1;min-width:0;border:0;border-radius:5px;background:#cbd5e1;color:#182f1e;font-size:11px;font-weight:800;cursor:pointer;position:relative}.cell.empty{background:#e3ece2}.cell.terrain{background:#bbf7d0}.cell.water{background:#bae6fd}.cell.road{background:#fed7aa}.cell.mosaic-red{background:#fb7185}.cell.mosaic-blue{background:#60a5fa}.cell.mosaic-yellow{background:#facc15}.cell.mosaic-green{background:#4ade80}.cell.route-a{background:#fbbf24}.cell.route-b{background:#a78bfa}.cell.route-c{background:#2dd4bf}.preview{width:118px;height:118px;border:4px dashed #047857;border-radius:14px;display:grid;place-items:center;margin:14px auto;font-size:17px;font-weight:900;text-align:center}.side{align-self:start}.muted{line-height:1.5;color:#5f7465}.status{min-height:28px;font-weight:800}.score{font-size:21px;font-weight:900;color:#047857}.rules{padding-left:18px;line-height:1.55}.legend{display:flex;gap:7px;flex-wrap:wrap}.legend i{width:18px;height:18px;border-radius:4px}.token{width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:#f43f5e;position:absolute;left:calc(50% - 13px);top:
