<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Alignement quatre</title><style>
:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#eef4fb;color:#17243a}body{margin:0}main{max-width:1050px;margin:auto;padding:20px}.panel{padding:17px;border:1px solid #cbd8eb;border-radius:16px;background:#fff}.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.bar h1{margin:0 auto 0 0}button,a,select{padding:8px 11px;border:1px solid #8da2c3;border-radius:9px;background:#fff;color:inherit;font:inherit;text-decoration:none;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;margin-top:16px}.board{--columns:7;display:grid;grid-template-columns:repeat(var(--columns),clamp(38px,8vw,70px));gap:6px;width:max-content;padding:11px;border-radius:16px;background:#1d4ed8}.slot{aspect-ratio:1;border:0;border-radius:50%;background:#eaf1fb;box-shadow:inset 0 4px 9px #17345b66}.slot.red{background:#ef4444}.slot.yellow{background:#facc15}.slot.win{outline:5px solid #22c55e;z-index:2}.rules{line-height:1.55}@media(max-width:760px){main{padding:9px}.layout{grid-template-columns:1fr}.layout aside{order:-1}.board{max-width:100%;box-sizing:border-box;grid-template-columns:repeat(var(--columns),1fr)}}@media(prefers-color-scheme:dark){:root{background:#101827;color:#edf4ff}.panel{background:#172235;border-color:#4b607d}button,a,select{background:#263447;border-color:#60718a}.slot{background:#dbe5f3}}
</style></head><body><main><section class="panel"><div class="bar"><h1>Alignement quatre</h1><a href="../../index.html">Hub</a><label>Plateau <select id="format"><option value="7x6">7 × 6</option><option value="8x7">8 × 7</option><option value="10x8">10 × 8</option></select></label><label>Bot <select id="difficulty"><option value="easy">Facile</option><option value="normal" selected>Moyen</option><option value="hard">Difficile</option><option value="expert">Extrême</option></select></label><label>Alignement <select id="target"><option value="4" selected>4</option><option value="5">5</option></select></label><button id="newGame">Nouvelle partie</button></div><div class="layout"><section><p id="status"></p><div id="board" class="board" aria-label="Plateau d’alignement"></div></section><aside><h2>Règles</h2><ul class="rules"><li>Choisissez une colonne : le pion tombe sur la première place libre.</li><li>Alignez le nombre demandé horizontalement, verticalement ou en diagonale.</li><li>Le bot joue les jaunes après chacun de vos pions rouges.</li></ul></aside></div></section></main><script src="../../shared/game-runtime.js?v=12"></script><script src="connect-four.js?v=1"></script><script src="../../shared/records.js?v=7"></script><script src="../../shared/options-help.js?v=4" data-options-help="true"></script></body></html>
