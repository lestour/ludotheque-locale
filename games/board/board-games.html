<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jeux de plateau</title><style>
:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#edf2f8;color:#17243a}body{margin:0;min-height:100vh}main{max-width:1440px;margin:auto;padding:22px}.panel{background:#fff;border:1px solid #d7e0ed;border-radius:18px;padding:18px;box-shadow:0 10px 32px #0f172a15}.toolbar,.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}h1{margin:0 auto 0 0}button,a,select{font:inherit;color:inherit;background:#fff;border:1px solid #9baac0;border-radius:9px;padding:8px 11px;cursor:pointer;text-decoration:none}button:hover,a:hover{background:#2447a8;color:#fff}button:disabled{opacity:.48;cursor:not-allowed}.muted,#log{color:#5b6b83;line-height:1.5}.game-layout{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:18px}.board-wrap{min-width:0;overflow:auto;padding:5px}.square-board{width:min(800px,92vw);aspect-ratio:1;margin:auto;display:grid;grid-template:repeat(11,1fr)/repeat(11,1fr);background:#e5dfcb;border:5px solid #33261e;box-shadow:0 9px 22px #0003}.space{position:relative;min-width:0;overflow:hidden;border:1px solid #806a5d;background:#f9f1dd;font-size:clamp(7px,1vw,11px);font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}.space .band{position:absolute;inset:0 0 auto;height:19%;background:var(--band,#d0d5dd)}.space .name{position:relative;margin-top:9%;word-break:break-word}.space.corner{font-size:clamp(10px,1.7vw,16px);background:#e3e0cf}.space.chance{background:#f6d6e9}.space.chest{background:#cae7f2}.space.tax{background:#ffe0d7}.token{position:relative;z-index:2;width:15px;height:15px;border:2px solid #fff;border-radius:50%;background:var(--token);box-shadow:0 1px 3px #0008;color:#fff;font-size:8px;display:inline-grid;place-items:center;margin:1px}.center-art{grid-area:2/2/11/11;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#f4df9c,#e9b674);border:2px solid #734c2f;text-align:center}.center-art h2{font-size:clamp(24px,5vw,65px);margin:0;letter-spacing:-2px}.center-art p{max-width:55%;margin:5px;font-size:clamp(10px,1.4vw,16px)}.world-art{background:radial-gradient(ellipse at 27% 43%,#76b86b 0 13%,transparent 14%),radial-gradient(ellipse at 45% 30%,#e5c253 0 13%,transparent 14%),radial-gradient(ellipse at 60% 55%,#d78b59 0 15%,transparent 16%),radial-gradient(ellipse at 76% 44%,#8ec1d5 0 11%,transparent 12%),linear-gradient(#86c9dd,#4f9fbe);color:#fff;text-shadow:0 2px 3px #17334c}.calendar-board{max-width:980px;margin:auto;padding:14px;border:5px solid #274c77;border-radius:18px;background:#eaf3fc}.calendar-title{text-align:center;font-size:clamp(22px,4vw,42px);font-weight:900;color:#1f4f81;margin-bottom:8px}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekday{text-align:center;font-weight:800;color:#52708c}.day{min-height:79px;border:1px solid #8ba4bc;border-radius:8px;padding:5px;background:#fff;position:relative;font-size:12px;font-weight:700}.day .daynum{font-size:17px;color:#264b6d}.day.mail{background:#ffe9a8}.day.deal{background:#d8f2d1}.day.lottery{background:#eddbf7}.day.bill{background:#ffd9d4}.day.payday{background:#a9e6c4}.day .tokens{position:absolute;right:2px;bottom:2px}.side{border:1px solid #d5e0ec;border-radius:13px;padding:13px;background:#f7fafc;align-self:start}.players{display:grid;gap:7px}.player{padding:8px;border-radius:8px;border:1px solid #d5e0ec;background:#fff}.player.active{outline:3px solid #f0b429}.player small{display:block;margin-top:3px}.cards{display:flex;gap:8px;flex-wrap:wrap}.card{min-width:120px;max-width:170px;min-height:80px;padding:9px;border:2px solid #36516f;border-radius:10px;background:#fff;text-align:left}.card.resource{border-top:12px solid var(--resource);font-size:12px}.card.selected{outline:4px solid #a855f7}.dice{font-size:32px;font-weight:900;color:#1e4f8b}.notice{padding:10px;border-radius:9px;background:#e8f0ff;color:#173c8e;font-weight:700}.modal{position:fixed;inset:0;z-index:9;background:#0008;display </style></head><body><main><section class="panel"><div class="toolbar"><h1 id="title"></h1><a href="../../index.html">Hub</a><button id="newGame">Nouvelle partie</button><label class="muted">Jeu <select id="variant"><option value="estate">Empire Immobilier</option><option value="world">Marchés du Monde</option><option value="payday">Fin de Mois</option></select></label><label class="muted">Skin <select id="boardSkin"><option value="france">France · villes</option><option value="usa">États-Unis</option><option value="uk">Royaume-Uni</option><option value="galaxy">Galaxie</option><option value="fantasy">Royaumes fantastiques</option><option value="academy">Académie magique</option></select></label><label class="muted">Joueurs <select id="playerCount"><option>2</option><option selected>3</option><option>4</option></select></label></div><div id="rules" class="muted"></div><div id="status" class="notice"></div><div class="game-layout"><section><div id="board" class="board-wrap"></div><div class="actions"><button id="roll">Lancer les dés</button><button id="buy" hidden>Acheter</button><button id="skip" hidden>Passer</button><button id="build" hidden>Construire</button><span id="dice" class="dice">—</span></div><div id="offers" class="cards"></div><ul id="log"></ul></section><aside class="side"><h2>Joueurs</h2><div id="players" class="players"></div><h2 id="assetsTitle">Actifs</h2><div id="assets" class="cards"></div></aside></div></section></main><script src="board-games.js?v=5"></script></body></html>
