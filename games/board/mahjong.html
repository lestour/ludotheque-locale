<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahjong Solitaire</title><style>
:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#edf4ef;color:#173020}body{margin:0;min-height:100vh}main{max-width:1280px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #c9dfce;border-radius:18px;padding:18px;box-shadow:0 10px 28px #0002}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:13px}h1{margin:0 auto 0 0}button,a{font:inherit;color:inherit;background:#fff;border:1px solid #8eaa95;border-radius:9px;padding:8px 11px;cursor:pointer;text-decoration:none}button:hover,a:hover{background:#177245;color:#fff}.muted{color:#567462;line-height:1.5}.stage-wrap{overflow:auto;padding:18px 8px;min-height:540px;background:radial-gradient(ellipse,#7fb789,#396e53);border:5px solid #69452f;border-radius:18px;box-shadow:inset 0 0 0 4px #e5c47b}.stage{position:relative;width:760px;height:500px;margin:auto}.tile{position:absolute;width:57px;height:73px;box-sizing:border-box;border:2px solid #72502d;border-radius:8px;background:linear-gradient(135deg,#fffdf4,#eee4c7);box-shadow:3px 4px 0 #6b4a2d,0 5px 8px #0004;color:#182b20;font-weight:900;font-size:19px;display:grid;place-items:center;cursor:pointer;transition:transform .16s,filter .16s}.tile:before{content:'麻';position:absolute;top:3px;left:5px;font-size:10px;color:#9e7746}.tile.free{outline:3px solid #f9df72;filter:brightness(1.06)}.tile.selected{outline:5px solid #9d4edd;transform:translateY(-8px) scale(1.05);z-index:30!important}.tile.locked{filter:brightness(.72) saturate(.75);cursor:not-allowed}.tile.man{color:#b91c1c}.tile.pin{color:#1d4ed8}.tile.hint{animation:pulse .8s ease-in-out infinite alternate}@keyframes pulse{to{outline-color:#f97316;transform:translateY(-5px)}}.stats{display:flex;gap:13px;flex-wrap:wrap;margin:13px 0}.stats strong{font-size:21px;color:#a55a12}.legend{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.legend span{padding:4px 8px;border-radius:99px;background:#e7f3e9;color:#245a35;font-size:12px}@media(prefers-color-scheme:dark){:root{background:#102419;color:#eaf9ee}.panel{background:#173524;border-color:#3b6b4b}.muted{color:#b5d7bf}button,a{background:#243f2e;color:#effcf3;border-color:#5b8b6a}.stage-wrap{background:radial-gradient(ellipse,#315d41,#133020)}.tile{background:linear-gradient(135deg,#f9efd3,#cdbd96);color:#172235}}</style></head><body><main><section class="panel"><div class="toolbar"><h1>Mahjong Solitaire</h1><a href="../../index.html">Hub</a><button id="newGame">Nouvelle partie</button><button id="hint">Indice</button><button id="undo">Annuler</button></div><p id="status" class="muted"></p><div class="legend"><span>Une tuile est libre sans tuile au-dessus et avec au moins un côté ouvert.</span><span>Associez deux tuiles identiques.</span></div><div class="stats"><span>Paires retirées <strong id="pairs">0</strong></span><span>Tuiles libres <strong id="free">0</strong></span></div><div class="stage-wrap"><div id="stage" class="stage" aria-label="Plateau de Mahjong"></div></div></section></main><script src="mahjong.js?v=3"></script></body></html>
