<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jeu de Go</title>
  <style>
    :root { color-scheme: light dark; font-family: Arial, sans-serif; background: #f3f6fb; color: #17243a; }
    body { margin: 0; min-height: 100vh; }
    main { max-width: 1180px; margin: auto; padding: 22px; }
    .panel, aside { border: 1px solid #cfdae8; border-radius: 15px; background: #fff; box-shadow: 0 8px 24px #0001; }
    .panel { padding: 17px; }
    .toolbar { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
    h1 { margin: 0 auto 0 0; }
    button, a, select, input { box-sizing: border-box; border: 1px solid #8fa1b8; border-radius: 9px; padding: 8px 11px; background: #fff; color: inherit; font: inherit; text-decoration: none; }
    button, a { cursor: pointer; }
    .layout { display: grid; grid-template-columns: minmax(350px, 760px) minmax(260px, 1fr); gap: 18px; margin-top: 15px; align-items: start; }
    .goban-wrap { overflow: auto; padding: 20px; border-radius: 13px; background: #704927; }
    .goban { --size: 9; width: min(720px, calc(100vw - 90px)); aspect-ratio: 1; display: grid; grid-template-columns: repeat(var(--size), 1fr); background: #d9a85e; border: 3px solid #342313; box-shadow: inset 0 0 18px #6f451f99; }
    .point { position: relative; border: 0; border-radius: 0; padding: 0; background: transparent; min-width: 0; }
    .point::before, .point::after { content: ''; position: absolute; z-index: 0; background: #402d1c; }
    .point::before { left: 0; right: 0; top: 50%; height: 1px; }
    .point::after { top: 0; bottom: 0; left: 50%; width: 1px; }
    .point.edge-left::before { left: 50%; } .point.edge-right::before { right: 50%; }
    .point.edge-top::after { top: 50%; } .point.edge-bottom::after { bottom: 50%; }
    .point:hover { background: #fff3; }
    .point.hint { background: #22c55e66; box-shadow: inset 0 0 0 3px #16a34a; animation: hint-pulse 1.1s ease-in-out infinite; }
    .stone { position: absolute; z-index: 2; inset: 8%; border-radius: 50%; box-shadow: inset -4px -5px 8px #0005, 1px 3px 5px #0007; }
    .stone.black { background: radial-gradient(circle at 35% 30%, #5b6471, #111827 54%); }
    .stone.white { background: radial-gradient(circle at 35% 30%, #fff, #d4d9df 63%); }
    .stone.placed { animation: stone-place .48s cubic-bezier(.16,.9,.28,1); }
    .last .stone { outline: 3px solid #ef4444; outline-offset: -5px; }
    .go-capture-ghost { position: fixed; z-index: 2147483000; pointer-events: none; }
    .go-capture-ghost .stone { display: block; }
    .goban.game-win { animation: goban-win .9s ease-out .43s both; }
    .goban.game-loss { animation: goban-loss .62s ease-in-out .43s both; }
    .goban.game-draw { animation: goban-draw .8s ease-out .43s both; }
    #status.result-win, #status.result-loss, #status.result-draw { font-weight: 800; padding: 9px 12px; border-radius: 10px; animation: result-pop .55s ease-out .35s both; }
    #status.result-win { color: #087a43; background: #dcfce7; }
    #status.result-loss { color: #b91c1c; background: #fee2e2; }
    #status.result-draw { color: #7c3aed; background: #ede9fe; }
    @keyframes stone-place { 0% { opacity: 0; transform: scale(1.75) translateY(-22%); filter: drop-shadow(0 12px 7px #0009); } 62% { transform: scale(.9); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes goban-win { 30% { box-shadow: inset 0 0 18px #6f451f99, 0 0 0 10px #22c55e88, 0 16px 32px #22c55e55; } 65% { transform: scale(1.012); } }
    @keyframes goban-loss { 18%, 55% { transform: translateX(-8px); } 36%, 72% { transform: translateX(8px); } 100% { filter: saturate(.72); } }
    @keyframes goban-draw { 45% { box-shadow: inset 0 0 18px #6f451f99, 0 0 0 8px #8b5cf688, 0 14px 28px #8b5cf644; } }
    @keyframes result-pop { 45% { transform: scale(1.045); } }
    @keyframes hint-pulse { 50% { background: #86efac99; box-shadow: inset 0 0 0 5px #15803d; } }
    aside { padding: 15px; }
    .go-actions { margin-bottom: 22px; }
    .go-rules { margin-top: 4px; }
    aside h2 { margin: 13px 0 7px; }
    .score { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .score div { padding: 10px; border-radius: 9px; background: #edf2f8; text-align: center; }
    .muted, #history { color: #5d6e85; line-height: 1.5; }
    #history { max-height: 240px; overflow: auto; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { .go-capture-ghost { display: none; } .stone.placed, .goban.game-win, .goban.game-loss, .goban.game-draw, #status.result-win, #status.result-loss, #status.result-draw { animation: none; } }
    @media (prefers-color-scheme: dark) {
      :root { background: #101827; color: #edf4ff; }
      .panel, aside { background: #172235; border-color: #3b4b63; }
      button, a, select, input { background: #263447; color: #f1f5fb; border-color: #60718a; }
      .score div { background: #263447; }
      .muted, #history { color: #b7c4d5; }
      #status.result-win { color: #bbf7d0; background: #14532d; }
      #status.result-loss { color: #fecaca; background: #7f1d1d; }
      #status.result-draw { color: #ddd6fe; background: #4c1d95; }
    }
  </style>
</head>
<body>
  <main><section class="panel">
    <div class="toolbar">
      <h1>Go</h1><a href="../../index.html">Hub</a><button id="newGame">Nouvelle partie</button>
      <label>Taille <select id="size"><option value="9">9 × 9</option><option value="13">13 × 13</option><option value="19">19 × 19</option><option value="25">25 × 25 · étendu</option><option value="29">29 × 29 · étendu</option></select></label>
      <label>Variante <select id="variant"><option value="area">Go · score par aire</option><option value="atari">Atari Go · première capture</option><option value="capture5">Capture 5 · cinq pierres</option><option value="nogo">NoGo · captures interdites</option></select></label>
      <label>Bot <select id="difficulty"><option value="easy">Facile</option><option value="normal" selected>Moyen</option><option value="hard">Difficile</option><option value="extreme">Extrême</option></select></label>
      <label>Komi <input id="komi" type="number" min="0" max="15" step="0.5" value="7.5"></label>
    </div>
    <p id="status" class="muted"></p>
    <div class="layout">
      <div class="goban-wrap"><div id="board" class="goban"></div></div>
      <aside>
        <div class="toolbar go-actions"><button id="pass">Passer</button><button id="hint">Indice</button><button id="undo">Annuler</button><button id="redo">Rétablir</button></div>
        <details class="go-rules" open><summary><strong>Règles du jeu</strong></summary><p id="rules" class="muted"></p></details>
        <h2>Score estimé</h2><div id="score" class="score"></div>
        <h2>Historique</h2><ol id="history"></ol>
      </aside>
    </div>
  </section></main>
  <script src="../../shared/game-runtime.js?v=3"></script>
  <script src="../../shared/effects.js?v=3"></script>
  <script src="../../shared/options-help.js?v=3"></script>
  <script src="go.js?v=6"></script>
</body>
</html>
