<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rhythm Lab</title>
  <style>
    :root { color-scheme: light dark; font-family: Arial, sans-serif; background: #eaf1fb; color: #17243a; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(#dbeafe, #b9d4ed); }
    main { max-width: 1280px; margin: auto; padding: 24px; }

    .track { padding: 7px 10px; border: 1px solid #8197b7; border-radius: 8px; background: #f8fbff; cursor: pointer; }

    .score-stage { display: block; width: 100%; max-width: 100%; height: auto; min-height: 0; padding: 28px 38px; overflow: hidden; box-sizing: border-box; background: #fff; }

    .clef { position: absolute; top: calc(61px + var(--staff-shift, 0px)); left: 14px; color: #263f63; font-size: 134px; line-height: 1; }
    .percussion-clef-symbol { display: block; width: 72px; height: 112px; color: inherit; transform: translateY(18px); }
    .score-change.incoming-clef .percussion-clef-symbol { width: 48px; height: 72px; transform: translateY(24px); }
    .score-note { position: absolute; z-index: 2; width: 23px; height: 17px; border: 2px solid #17243a; border-radius: 52%; color: #17243a; background: var(--note); transform: rotate(-17deg); box-sizing: border-box; will-change: transform; }

    .score-note.flag-1::before, .score-note.flag-2::before, .score-note.flag-3::before { position: absolute; z-index: 3; bottom: 29px; left: 19px; width: 12px; height: 16px; border-right: 4px solid #17243a; border-bottom: 4px solid #17243a; border-radius: 0 0 12px; content: ''; transform: rotate(17deg) skewY(24deg); transform-origin: top left; }
    .score-note.flag-2::before { box-shadow: 3px 7px 0 -1px #17243a; }

    .score-note .fingering.stacked { min-width: 20px; max-width: 24px; padding: 3px 2px; line-height: .95; }
    .score-note .fingering.lower { top: 55px; }
    .score-note .duration-dot { position: absolute; left: 26px; top: 1px; font-size: 16px; transform: rotate(17deg); }
    .score-note .chord-count { position: absolute; top: -15px; right: -16px; color: #334155; font-size: 10px; transform: rotate(18deg); }
    .score-note .tuplet-number { position: absolute; bottom: 43px; left: 50%; min-width: 18px; color: #334155; font: 900 10px/1 Arial,sans-serif; text-align: center; transform: translateX(-50%) rotate(17deg); }
    .score-note.grace { width: 16px; height: 12px; transform: rotate(-24deg) scale(.82); }
    .score-note.grace::after { left: 12px; height: 32px; }
    .score-note.grace::before { position: absolute; z-index: 4; left: 6px; top: -14px; width: 2px; height: 39px; background: #17243a; content: ''; transform: rotate(52deg); }
    .score-note .articulation { position: absolute; bottom: -20px; left: 5px; color: #17243a; font-size: 17px; font-weight: 900; transform: rotate(18deg); }
    .score-note .notation-symbols { position: absolute; top: 45px; left: -28px; width: 80px; overflow: hidden; color: #475569; font-size: 8px; font-style: normal; text-align: center; text-overflow: ellipsis; white-space: nowrap; transform: rotate(17deg); }
    .beam-segment { position: absolute; z-index: 3; height: 5px; border-radius: 2px; background: #17243a; transform-origin: left center; }

    .tie-incoming { position: absolute; right: 17px; top: 8px; width: 34px; height: 12px; border-bottom: 3px solid #17243a; border-radius: 0 0 50% 50%; pointer-events: none; transform: rotate(17deg); transform-origin: right center; }
    .score-rest { position: absolute; z-index: 2; width: 32px; height: 54px; color: #17243a; transform: translate(-50%,-18px); }
    .rest-symbol { display: block; width: 32px; height: 54px; overflow: visible; fill: currentColor; }
    .whole-rest { transform: translateY(-1px); }
    .half-rest { transform: translateY(-5px); }
    .score-rest b { position: absolute; left: 50%; bottom: 38px; min-width: 22px; padding: 2px 5px; border-radius: 10px; color: #fff; background: #315fa7; font: 800 11px/1 Arial,sans-serif; text-align: center; transform: translateX(-50%); }
    .rest-annotation { position: absolute; left: 50%; top: -20px; color: currentColor; font: normal 18px/1 serif; white-space: nowrap; transform: translateX(-50%); }
    .measure-line { position: absolute; z-index: 1; top: calc(91px + var(--staff-shift, 0px)); width: 2px; height: 91px; background: #64748b; opacity: .72; }
    .measure-line small { position: absolute; top: -17px; left: 4px; color: #64748b; font: 700 9px/1 Arial,sans-serif; }
    .duration-track { position: relative; min-width: 0; height: 72px; margin-top: 94px; border-top: 1px solid #94a3b8; background: #f8fafc; }

    .duration-mark.tap { width: 8px !important; height: 8px; border-radius: 50%; }
    .duration-mark::after { position: absolute; top: 16px; left: 0; width: 100%; max-width: 100%; color: #52657f; content: attr(data-label); font-size: 9px; line-height: 1.12; overflow-wrap: anywhere; text-align: center; white-space: normal; }
    .duration-mark.tap::after { display: none; }
    .duration-label { position: absolute; left: 0; top: -18px; color: #52657f; font-size: 11px; font-weight: 700; }
    .hit-line { position: absolute; z-index: 4; top: -18px; bottom: -18px; width: 4px; border-radius: 3px; background: #e11d48; box-shadow: 0 0 12px #e11d48; }
    .microphone-pitch-line { position: absolute; z-index: 4; right: 0; height: 3px; border-radius: 2px; background: #16a34a; box-shadow: 0 0 8px #22c55e; pointer-events: none; }
    .microphone-pitch-line b { position: absolute; right: 4px; bottom: 5px; padding: 2px 5px; border-radius: 5px; color: #fff; background: #15803d; font: 800 10px/1 Arial,sans-serif; white-space: nowrap; }
    .tuner-display { display: inline-flex; min-width: 180px; align-items: center; justify-content: center; padding: 7px 10px; border: 1px solid #94a3b8; border-radius: 8px; background: #f8fafc; font-variant-numeric: tabular-nums; }
    .tuner-display[hidden] { display: none; }

    .key-signature i { position: absolute; top: calc(77px + var(--staff-pos) * 11px); left: calc(var(--index, 0) * 10px); font: normal 32px/1 serif; }
    .key-signature i:nth-child(1){--index:0}.key-signature i:nth-child(2){--index:1}.key-signature i:nth-child(3){--index:2}.key-signature i:nth-child(4){--index:3}.key-signature i:nth-child(5){--index:4}.key-signature i:nth-child(6){--index:5}.key-signature i:nth-child(7){--index:6}
    .natural-key { position: absolute; top: 123px; left: 4px; color: #94a3b8; font-size: 24px; }
    .time-signature { position: absolute; z-index: 3; top: calc(112px + var(--staff-shift, 0px)); left: 156px; display: grid; color: #17243a; font: 900 34px/.83 Georgia,serif; text-align: center; }
    .score-change { position: absolute; z-index: 3; top: -25px; padding: 3px 6px; border: 1px solid #64748b; border-radius: 5px; color: #17243a; background: #fff; font-size: 11px; font-weight: 800; white-space: nowrap; transform: translateX(-50%); }
    .score-change.incoming-signature { top: 0; padding: 0; border: 0; background: #ffffffeb; transform: translateX(-50%); }
    .score-change.incoming-signature.key-signature { left: auto; width: 78px; }
    .score-change.incoming-signature.key-signature { background: transparent; }
    .score-change.incoming-signature.time-signature { left: auto; width: 42px; }
    .score-change.incoming-clef { top: calc(63px + var(--staff-shift, 0px)); padding: 0 5px; border: 0; background: #ffffffeb; font-size: 82px; line-height: 1; }
    .score-keys { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 18px; }
    .score-keys span { padding: 8px 12px; border: 2px solid var(--lane, #315fa7); border-radius: 7px; color: #17243a; background: #fff; font-weight: 800; }
    .score-keys span.pressed { color: #fff; background: #315fa7; box-shadow: 0 0 0 4px #60a5fa55; transform: translateY(3px); }
    .score-keys span.breathing, .instrument-guide .valve.breathing { color: #17243a; background: #fb923c; box-shadow: 0 0 0 5px #fb923c55; }
    .instrument-guide .slide-scale.breathing input { accent-color: #fb923c; }

    .instrument-guide .valve.zero { border-style: dashed; }

    .instrument-guide .valve.active { background: #facc15; transform: translateY(7px); }
    .instrument-guide .valve small { display: block; font-size: 9px; }
    .instrument-guide input[type=range] { width: 240px; accent-color: #e11d48; }
    .instrument-guide small { color: #52657f; }
    .stage-wrap.slide-at-left { display: grid; grid-template-columns: 112px minmax(0,1fr); column-gap: 12px; align-items: center; }

    .slide-scale { position: relative; display: grid; place-items: center; }

    .instrument-guide.vertical-slide .slide-scale i { position: absolute; top: calc(10px + var(--position) * 53px); right: 0; display: block; color: #52657f; font-size: 11px; font-style: normal; }
    .input-mapping { margin: 0 0 16px; padding: 14px; border: 1px solid #9db4d1; border-radius: 13px; background: #eef6ff; }

    .mapping-group button { padding: 6px 9px; }
    .mapping-group button.listening { color: #fff; background: #e11d48; animation: mapping-pulse .7s infinite alternate; }

    @media (max-width: 700px) { main { padding: 10px; } .stage { height: 520px; } .stage-wrap { margin-top: 80px; } .hint { margin: -74px 0 56px; } }

<body>
  <main><section class="panel">
    <div class="toolbar"><h1>Rhythm Lab</h1><a href="../../index.html">Hub</a><label class="muted">Partition <input id="file" type="file" accept=".mscz,.mscx,.musicxml,.xml"></label><label class="muted">Affichage <select id="mode"><option value="piano">Piano · 12 touches</option><option value="buttons">Boutons · 11 touches</option><option value="score" selected>Partition colorée</option></select></label><label class="muted"><input id="accidentals" type="checkbox" checked> Dièses / bémols</label><button id="start">Démarrer</button></div>
    <div class="muted">Import local MuseScore (`.mscz`/`.mscx`) ou MusicXML. Les notes entrent au-dessus de la zone pour laisser le temps d’anticiper ; choisissez AZERTY, QWERTY ou QWERTZ dans les options de commande.</div>
    <div id="trackList" class="tracks"></div><div class="stats"><span>Score <strong id="score">0</strong></span><span>Précision <strong id="accuracy">—</strong></span><span id="status" class="muted">Démo chargée.</span></div><div id="records" class="records muted"></div>
    <div class="stage-wrap"><div class="hint">Zone d’anticipation</div><div id="stage" class="stage"></div></div>
  </section></main>
