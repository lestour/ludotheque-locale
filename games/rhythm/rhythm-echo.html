<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Écho rythmique</title><style>
:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#eef4fb;color:#17243a}body{margin:0}main{max-width:900px;margin:auto;padding:20px}.panel{padding:17px;border:1px solid #cbd8eb;border-radius:16px;background:#fff}.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.bar h1{margin:0 auto 0 0}button,a,select{padding:8px 11px;border:1px solid #8da2c3;border-radius:9px;background:#fff;color:inherit;font:inherit;text-decoration:none;cursor:pointer}.pads{display:grid;grid-template-columns:repeat(2,minmax(110px,210px));gap:13px;justify-content:center;margin:28px auto}.tone{aspect-ratio:1;border:0;border-radius:22px;opacity:.72;transition:transform .08s,filter .08s}.tone.active{filter:brightness(1.45);transform:scale(.94);outline:6px solid #fff}.tone:nth-child(1){background:#ef4444}.tone:nth-child(2){background:#3b82f6}.tone:nth-child(3){background:#22c55e}.tone:nth-child(4){background:#facc15}.score{text-align:center;font-size:24px;font-weight:900}.rules{line-height:1.55}@media(max-width:600px){main{padding:9px}.pads{grid-template-columns:repeat(2,minmax(100px,1fr))}}@media(prefers-color-scheme:dark){:root{background:#101827;color:#edf4ff}.panel{background:#172235;border-color:#4b607d}button,a,select{background:#263447;border-color:#60718a}}
</style></head><body><main><section class="panel"><div class="bar"><h1>Écho rythmique</h1><a href="../../index.html">Hub</a><label>Tempo <select id="tempo"><option value="700">Lent</option><option value="500" selected>Moyen</option><option value="340">Rapide</option></select></label><label>Départ <select id="startLength"><option value="2">2 sons</option><option value="3" selected>3 sons</option><option value="5">5 sons</option></select></label><label>Mode <select id="mode"><option value="classic">Classique</option><option value="reverse">Réponse inversée</option><option value="rhythm">Rythme seul</option></select></label><button id="start">Démarrer</button></div><p id="status"></p><div id="pads" class="pads"><button class="tone" data-tone="0" aria-label="Rouge, touche D"></button><button class="tone" data-tone="1" aria-label="Bleu, touche F"></button><button class="tone" data-tone="2" aria-label="Vert, touche J"></button><button class="tone" data-tone="3" aria-label="Jaune, touche K"></button></div><p id="score" class="score">Niveau 0</p><h2>Règles</h2><ul class="rules"><li>Écoutez la séquence, puis reproduisez-la avec D, F, J et K.</li><li>Chaque tour ajoute un son et accélère légèrement la lecture.</li><li>Le mode inversé demande la séquence dans l’ordre opposé ; le mode rythme utilise un seul bouton.</li></ul></section></main><script src="../../shared/game-runtime.js?v=12"></script><script src="rhythm-echo.js?v=1"></script><script src="../../shared/records.js?v=7"></script><script src="../../shared/options-help.js?v=4" data-options-help="true"></script></body></html>
