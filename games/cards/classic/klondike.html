<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solitaire Klondike</title>
  <style>
    :root { color-scheme: light dark; font-family: Arial, sans-serif; background: #f3f6fb; color: #152238; }
    body { margin: 0; min-height: 100vh; }
    main { max-width: 1180px; margin: auto; padding: 24px; }
    .panel { background: #fff; border: 1px solid #d7e0ed; border-radius: 16px; padding: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    h1 { margin: 0 auto 0 0; }
    button, a { border: 1px solid #9baac0; border-radius: 10px; padding: 8px 12px; background: #fff; color: #152238; font: inherit; text-decoration: none; cursor: pointer; }
    button:hover, a:hover { background: #2447a8; color: #fff; border-color: #2447a8; }
    .muted { color: #61718a; font-size: 14px; }
    .top-row { display: flex; justify-content: space-between; gap: 20px; margin: 20px 0 32px; }
    .draw-pile, #foundations { display: flex; gap: 12px; }
    .foundation-slot, .tableau-slot, #stock, #waste { position: relative; width: 92px; min-height: 130px; border: 2px dashed #a5b4c8; border-radius: 12px; padding: 0; background: #eef3f9; }
    .foundation-slot { border-style: solid; }
    #stock { display: grid; place-items: center; overflow: visible; }
    #stock.has-cards { border-color: transparent; background: transparent; }
    #stock .stock-layer { position: absolute; left: 0; top: 0; width: 92px; height: 130px; box-sizing: border-box; border: 2px solid #203048; border-radius: 11px; background: repeating-linear-gradient(45deg, #294c9c, #294c9c 8px, #e7efff 8px, #e7efff 16px); box-shadow: 1px 1px 0 rgba(32,48,72,.2); pointer-events: none; }
    #stock .card { position: absolute; left: 0; top: 0; }
    .stock-draw-animation { position: fixed; z-index: 50; width: 92px; height: 130px; box-sizing: border-box; perspective: 500px; pointer-events: none; transition: transform .52s ease-in-out, opacity .52s ease-in-out; }
    .stock-draw-animation .flip-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .24s ease-in-out; }
    .stock-draw-animation .flip-face { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; padding: 8px; border: 2px solid #203048; border-radius: 11px; box-shadow: 2px 3px 0 rgba(32,48,72,.18); backface-visibility: hidden; font-size: 22px; }
    .stock-draw-animation .flip-back { display: grid; place-items: center; border-color: #294c9c; background: repeating-linear-gradient(45deg, #294c9c, #294c9c 8px, #e7efff 8px, #e7efff 16px); color: #fff; font-size: 38px; }
    .stock-draw-animation .flip-front { background: #fff; color: #17243a; }
    .stock-draw-animation .flip-front strong { align-self: center; font-size: 48px; line-height: 1; }
    .stock-draw-animation .flip-front.red { color: #c8263f; }
    .stock-draw-animation .flip-horizontal .flip-front { transform: rotateY(180deg); }
    .stock-draw-animation .flip-horizontal.revealed { transform: rotateY(180deg); }
    .stock-draw-animation .flip-vertical .flip-front { transform: rotateX(180deg); }
    .stock-draw-animation .flip-vertical.revealed { transform: rotateX(180deg); }
    #waste { display: block; transition: width .15s ease; }
    .waste-card { position: absolute; top: 0; }
    .waste-card:not(.playable) { pointer-events: none; }
    .slot-empty { color: #71819a; font-size: 28px; }
    .card { width: 92px; height: 130px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; border: 2px solid #203048; border-radius: 11px; background: #fff; box-shadow: 2px 3px 0 rgba(32,48,72,.18); color: #17243a; font-size: 22px; text-align: left; }
    .card strong { align-self: center; font-size: 48px; line-height: 1; }
    .card.red { color: #c8263f; }
    .card.selected { outline: 4px solid #efab24; outline-offset: 2px; z-index: 5; }
    .card.back { display: grid; place-items: center; background: repeating-linear-gradient(45deg, #294c9c, #294c9c 8px, #e7efff 8px, #e7efff 16px); color: #fff; font-size: 38px; }
    #tableau { display: grid; grid-template-columns: repeat(7, 92px); gap: 12px; }
    .tableau-slot { min-height: 410px; }
    .tableau-card { position: absolute; left: 0; width: 92px; height: 130px; }
    #status { min-height: 24px; font-weight: 700; }
    .game-area { padding: 4px; }
    .hint { outline: 4px solid #a855f7; outline-offset: 2px; z-index: 6; }
    .hint-target { border-color: #a855f7; box-shadow: inset 0 0 0 3px #e9d5ff; }
    .card.dragging { opacity: .45; cursor: grabbing; }
    .card.arrive { animation: card-arrive .28s ease-out; }
    .tableau-card.flipping .card { animation: card-flip .34s ease-in-out; }
    @keyframes card-arrive { from { transform: translateY(-18px) scale(.9); opacity: .35; } to { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes card-flip { 0% { transform: scaleX(1); } 49% { transform: scaleX(.04); } 50% { transform: scaleX(.04); } 100% { transform: scaleX(1); } }
    @media (prefers-color-scheme: dark) {
      :root { background: #101827; color: #e8eef8; }
      .panel { background: #172235; border-color: #34445e; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
      button, a { background: #263447; border-color: #60718a; color: #f1f5fb; }
      .muted { color: #b5c1d1; }
      .foundation-slot, .tableau-slot, #stock, #waste { background: #1f2c3e; border-color: #60718a; }
      .card { background: #eef4fd; }
    }
  </style>
</head>
<body>
  <main><section class="panel">
    <div class="toolbar"><h1>Solitaire Klondike</h1><a href="../../../index.html">Hub de jeux</a><button id="newGame">Nouvelle partie</button><label class="muted">Difficulté <select id="dealDifficulty"><option value="easy">Facile</option><option value="normal" selected>Moyen</option><option value="hard">Difficile</option><option value="expert">Expert</option></select></label><label class="muted">Pioche <select id="drawCount"><option value="1">1 carte</option><option value="3">3 cartes</option></select></label><label class="muted">Recyclages <select id="redealLimit"><option value="Infinity" selected>illimités</option><option value="3">3 passages</option><option value="1">1 passage</option></select></label><label class="muted">As dans le tableau <select id="acePosition"><option value="end" selected>en fin (K → A)</option><option value="start">au début (A → K)</option></select></label></div>
    <div class="toolbar"><button id="undo" disabled>Annuler</button><button id="redo" disabled>Rétablir</button><button id="hint">Indice</button><button id="solveStep">Déduction suivante</button><button id="solveAll">Déductions automatiques</button><button id="finishGame" disabled>Terminer automatiquement</button><button id="autoFoundation">Envoyer vers une fondation</button><span class="muted">Score : <strong id="score">0</strong></span><span id="errorCount" class="muted">Erreurs : 0</span></div>
    <div class="toolbar"><button id="traceMode" disabled>Voir la trace</button><button id="previousTrace" disabled>Étape précédente</button><input id="traceSlider" type="range" min="0" max="0" value="0" disabled><button id="nextTrace" disabled>Étape suivante</button><span id="traceLabel" class="muted">Aucune trace.</span></div>
    <div class="muted">Cliquez ou glissez une carte visible vers sa destination. Les suites descendent en alternant les couleurs ; les fondations montent de l’As au Roi.</div>
    <div id="status" class="muted"></div><div class="muted">Pioche : <strong id="stockCount">24</strong> · Défausse : <strong id="wasteCount">0</strong> · Tableau caché : <strong id="hiddenCount">21</strong> · Règle active : <span id="rulesSummary"></span></div>
    <div class="game-area">
      <div class="top-row"><div class="draw-pile"><div id="stock" role="button" tabindex="0" aria-label="Pioche"></div><div id="waste" role="button" tabindex="0" aria-label="Défausse"></div></div><div id="foundations" aria-label="Fondations"></div></div>
      <div id="tableau" aria-label="Tableau du Solitaire"></div>
    </div>
  </section></main>
  <script src="../../../shared/cards.js?v=18"></script>
  <script src="klondike.js?v=21"></script>
  <script src="../../../shared/records.js?v=2"></script>
</body>
</html>
