<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bataille</title>
  <style>
    :root{color-scheme:light dark;font-family:Arial,sans-serif;background:#f3f6fb;color:#152238}body{margin:0;min-height:100vh}main{max-width:1080px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #d7e0ed;border-radius:16px;padding:18px;box-shadow:0 8px 24px #0002}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}h1{margin:0 auto 0 0}button,a,select{border:1px solid #9baac0;border-radius:10px;padding:8px 12px;background:#fff;color:#152238;font:inherit;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#2447a8;color:#fff;border-color:#2447a8}button:disabled{cursor:not-allowed;opacity:.55}.muted{color:#61718a;font-size:14px}.scores{display:grid;grid-template-columns:repeat(2,minmax(110px,1fr));gap:10px;margin:18px 0}.score{padding:12px;border:1px solid #d7e0ed;border-radius:12px;text-align:center;background:#f8fafc}.score strong{display:block;font-size:26px}.table{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;align-items:start;margin:22px auto}.player{text-align:center;font-weight:700}.play-zone{min-height:205px;display:grid;grid-template-columns:112px 112px;justify-content:center;align-items:center;gap:10px;position:relative}.deck-stack{position:relative;width:108px;height:calc(154px + var(--stack-offset,0px));align-self:center}.deck-stack.empty{height:154px;border:2px dashed #9baac0;border-radius:12px}.deck-layer{position:absolute;width:104px;height:148px;box-sizing:border-box;border:2px solid #203048;border-radius:12px;background:repeating-linear-gradient(45deg,#294c9c,#294c9c 8px,#e7efff 8px,#e7efff 16px);box-shadow:1px 1px 0 #fff8}.deck-count{position:absolute;z-index:70;right:-7px;bottom:-8px;min-width:28px;padding:5px 7px;border-radius:999px;background:#17243a;color:#fff;font-size:12px;box-shadow:0 2px 7px #0004}.revealed{position:relative;width:104px;height:148px}.flip-card{position:absolute;inset:0;perspective:700px}.flip-inner{position:absolute;inset:0;transform-style:preserve-3d;animation:turn-card-vertical .62s cubic-bezier(.2,.75,.25,1) forwards}.card-face{position:absolute;inset:0;backface-visibility:hidden}.card-face.front{transform:rotateX(180deg)}.card{width:104px;height:148px;display:flex;flex-direction:column;justify-content:space-between;padding:10px;border:2px solid #203048;border-radius:12px;box-sizing:border-box;background:#fff;box-shadow:3px 4px 0 #2030482e;font-size:26px;text-align:left}.card strong{align-self:center;font-size:58px;line-height:1}.card.red{color:#c8263f}.card.black{color:#17243a}.card.back{display:grid;place-items:center;background:repeating-linear-gradient(-45deg,#173f91,#173f91 8px,#dbeafe 8px,#dbeafe 16px);color:#fff;font-size:34px}.card.empty{display:grid;place-items:center;color:#8a98ac;box-shadow:none}.outcome-icon{position:absolute;z-index:8;inset:39px 23px auto;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;color:#fff;font-size:39px;font-weight:900;line-height:1;opacity:0;animation:show-outcome .42s .58s ease-out forwards}.winner .outcome-icon{background:#15803ddd;box-shadow:0 0 0 7px #86efac77}.loser .outcome-icon{background:#b91c1cdd;box-shadow:0 0 0 7px #fca5a577}.winner{animation:winner-bounce .75s .52s ease-out}.loser{animation:loser-shake .55s .55s ease-out}.winner .card{box-shadow:0 0 0 4px #22c55e,0 10px 24px #15803d77}.loser .card{filter:saturate(.55) brightness(.82)}@keyframes turn-card-vertical{0%{transform:rotateX(0)}48%{transform:rotateX(86deg) scale(.97)}100%{transform:rotateX(180deg)}}@keyframes show-outcome{from{opacity:0;transform:scale(.35) rotate(-25deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes winner-bounce{55%{transform:translateY(-12px) scale(1.07)}75%{transform:translateY(3px)}}@keyframes loser-shake{30%{transform:translateX(-7px) rotate(-2deg)}55%{transform:translateX(7px) rotate(2deg)}80%{transform:translateX(-3px)}}#status{min-height:24px;text-align:center;font-weight:700}#history{margin:18px 0 0;padding-left:22px;color:#53647d;line-height:1.6}@media(prefers-color-scheme:dark){:root{background:#101827;color:#e8eef8}.panel{background:#172235;border-color:#34445e;box-shadow:0 8px 24px #0005}button,a,select{background:#263447;border-color:#60718a;color:#f1f5fb}.muted,#history{color:#b5c1d1}.score{background:#1f2c3e;border-color:#40516a}.card{background:#eef4fd;border-color:#b9c7da}.card.empty{background:#263447;color:#b5c1d1}}
  </style>
</head>
<body>
  <main><section class="panel">
    <div class="toolbar"><h1>Bataille</h1><a href="../../../index.html">Hub de jeux</a><button id="newGame">Nouvelle partie</button><label class="muted">Joueurs <select id="playerCount"><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label></div>
    <div class="muted">Chaque paquet montre son volume réel : une tranche visible correspond à une carte restante.</div>
    <div class="scores"><div class="score">Cartes au pli<strong id="potCount">0</strong></div><div class="score">Tour<strong id="roundCount">0</strong></div></div>
    <div id="playersTable" class="table"></div><div id="status" class="muted"></div>
    <div class="toolbar"><button id="draw">Retourner les cartes</button></div><ul id="history" aria-live="polite"></ul>
  </section></main>
  <script src="../../../shared/game-runtime.js?v=8"></script><script src="../../../shared/cards.js?v=18"></script><script src="bataille.js?v=7"></script><script src="../../../shared/records.js?v=4"></script>
</body>
</html>
