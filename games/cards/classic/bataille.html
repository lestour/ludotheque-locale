<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bataille</title>
<style>
:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#f3f6fb;color:#152238}body{margin:0;min-height:100vh}main{max-width:980px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #d7e0ed;border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.08)}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}h1{margin:0 auto 0 0}button,a,select{border:1px solid #9baac0;border-radius:10px;padding:8px 12px;background:#fff;color:#152238;font:inherit;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#2447a8;color:#fff;border-color:#2447a8}button:disabled{cursor:not-allowed;opacity:.55}.muted{color:#61718a;font-size:14px}.scores{display:grid;grid-template-columns:repeat(2,minmax(110px,1fr));gap:10px;margin:18px 0}.score{padding:12px;border:1px solid #d7e0ed;border-radius:12px;text-align:center;background:#f8fafc}.score strong{display:block;font-size:26px}.table{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;align-items:start;margin:22px auto}.player{text-align:center;font-weight:700}.card-slot{--layers:0;min-height:166px;display:grid;place-items:center;position:relative}.card-slot[data-count]:not([data-count="0"])::before{content:'';position:absolute;width:100px;height:144px;border:2px solid #203048;border-radius:12px;background:repeating-linear-gradient(45deg,#294c9c,#294c9c 8px,#e7efff 8px,#e7efff 16px);box-shadow:calc(var(--layers) * 1px) calc(var(--layers) * 1px) 0 #9baac0;transform:translate(-8px,-7px)}.card{width:104px;height:148px;position:relative;z-index:1;display:flex;flex-direction:column;justify-content:space-between;padding:10px;border:2px solid #203048;border-radius:12px;box-sizing:border-box;background:#fff;box-shadow:3px 4px 0 rgba(32,48,72,.18);font-size:26px;text-align:left}.card strong{align-self:center;font-size:58px;line-height:1}.card.flip-vertical{animation:flip-vertical .42s ease-out;transform-style:preserve-3d}@keyframes flip-vertical{0%{transform:rotateX(90deg);opacity:.2}55%{transform:rotateX(-9deg)}100%{transform:rotateX(0);opacity:1}}.card.red{color:#c8263f}.card.black{color:#17243a}.card.empty{display:grid;place-items:center;color:#8a98ac;box-shadow:none}#status{min-height:24px;text-align:center;font-weight:700}#history{margin:18px 0 0;padding-left:22px;color:#53647d;line-height:1.6}@media(prefers-color-scheme:dark){:root{background:#101827;color:#e8eef8}.panel{background:#172235;border-color:#34445e;box-shadow:0 8px 24px rgba(0,0,0,.3)}button,a,select{background:#263447;border-color:#60718a;color:#f1f5fb}.muted,#history{color:#b5c1d1}.score{background:#1f2c3e;border-color:#40516a}.card{background:#eef4fd;border-color:#b9c7da}.card.empty{background:#263447;color:#b5c1d1}}</style></head>
<body><main><section class="panel"><div class="toolbar"><h1>Bataille</h1><a href="../../../index.html">Hub de jeux</a><button id="newGame">Nouvelle partie</button><label class="muted">Joueurs <select id="playerCount"><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label></div><div class="muted">Jeu local : chaque joueur retourne une carte, la plus forte remporte le pli. En cas d’égalité, les joueurs concernés font une bataille.</div><div class="scores"><div class="score">Cartes au pli<strong id="potCount">0</strong></div><div class="score">Tour<strong id="roundCount">0</strong></div></div><div id="playersTable" class="table"></div><div id="status" class="muted"></div><div class="toolbar"><button id="draw">Retourner les cartes</button></div><ul id="history" aria-live="polite"></ul></section></main><script src="../../../shared/cards.js?v=17"></script><script src="bataille.js?v=4"></script></body></html>
