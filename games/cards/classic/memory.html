<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Paires mémoire</title><style>
:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#eef4fb;color:#17243a}body{margin:0}main{max-width:1050px;margin:auto;padding:20px}.panel{padding:17px;border:1px solid #cbd8eb;border-radius:16px;background:#fff}.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.bar h1{margin:0 auto 0 0}button,a,select{padding:8px 11px;border:1px solid #8da2c3;border-radius:9px;background:#fff;color:inherit;font:inherit;text-decoration:none;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;margin-top:16px}.board{display:grid;grid-template-columns:repeat(var(--columns),minmax(55px,92px));gap:9px}.card{aspect-ratio:3/4;display:grid;place-items:center;border:3px solid #315fc9;border-radius:12px;background:linear-gradient(135deg,#1e3a8a,#7c3aed);color:#fff;font-size:clamp(25px,5vw,43px);font-weight:900}.card.open,.card.matched{background:#fff;color:#17243a}.card.matched{border-color:#16a34a;background:#dcfce7}.score{font-size:20px;font-weight:900}.rules{line-height:1.55}@media(max-width:720px){main{padding:9px}.layout{grid-template-columns:1fr}.layout aside{order:-1}.board{grid-template-columns:repeat(var(--columns),1fr)}}@media(prefers-color-scheme:dark){:root{background:#101827;color:#edf4ff}.panel{background:#172235;border-color:#4b607d}button,a,select{background:#263447;border-color:#60718a}.card.open{background:#e8eef8;color:#17243a}}
</style></head><body><main><section class="panel"><div class="bar"><h1>Paires mémoire</h1><a href="../../../index.html">Hub</a><label>Paires <select id="pairs"><option value="6">6</option><option value="8" selected>8</option><option value="12">12</option><option value="18">18</option></select></label><label>Bot <select id="difficulty"><option value="none">Sans bot</option><option value="easy">Facile</option><option value="normal" selected>Moyen</option><option value="hard">Difficile</option></select></label><label>Thème <select id="theme"><option value="animals">Animaux</option><option value="food">Cuisine</option><option value="music">Musique</option></select></label><button id="newGame">Nouvelle partie</button></div><div class="layout"><section><p id="status"></p><div id="board" class="board"></div></section><aside><p id="score" class="score"></p><h2>Règles</h2><ul class="rules"><li>Retournez deux cartes pour chercher une paire identique.</li><li>Une paire trouvée reste visible et donne un point.</li><li>Avec un bot, le joueur qui trouve une paire rejoue.</li></ul></aside></div></section></main><script src="../../../shared/game-runtime.js?v=12"></script><script src="memory.js?v=1"></script><script src="../../../shared/records.js?v=7"></script><script src="../../../shared/options-help.js?v=4" data-options-help="true"></script></body></html>
