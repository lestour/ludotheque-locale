<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Casino & plis</title><style>
:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#eef4fb;color:#17243a}body{margin:0}main{max-width:1120px;margin:auto;padding:22px}.panel{background:#fff;border:1px solid #cbd8eb;border-radius:17px;padding:18px;box-shadow:0 8px 24px #0f254012}.bar,.actions,.hand{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.bar{margin-bottom:14px}.bar h1{margin:0 auto 0 0}button,a,select{font:inherit;color:inherit;background:#fff;border:1px solid #8da2c3;border-radius:9px;padding:8px 11px;text-decoration:none;cursor:pointer}button:hover,a:hover,.primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:16px}.table{min-height:470px;display:grid;place-content:center;gap:24px;border-radius:15px;background:radial-gradient(circle,#177b54,#064e3b);color:#fff;padding:22px}.zone{text-align:center}.hand{justify-content:center;min-height:120px}.card{width:72px;height:102px;border:2px solid #f8fafc;border-radius:10px;background:#fff;color:#17243a;display:grid;place-items:center;font-size:30px;font-weight:900;box-shadow:0 5px 10px #0004;cursor:pointer}.card.red{color:#be123c}.card.back{background:repeating-linear-gradient(45deg,#1d4ed8 0 7px,#dbeafe 7px 14px);color:#fff}.card:hover{transform:translateY(-6px)}.side{align-self:start}.muted{line-height:1.5;color:#64748b}.status{min-height:28px;font-weight:800}.score{font-size:21px;font-weight:900}.rules{padding-left:20px;line-height:1.55}.hidden{display:none}@media(max-width:750px){main{padding:10px}.layout{grid-template-columns:1fr}.side{order:-1}.table{min-height:390px}.card{width:57px;height:82px;font-size:23px}}@media(prefers-color-scheme:dark){:root{background:#101827;color:#e8eef8}.panel,.side{background:#172235;border-color:#445978}.muted{color:#b8c7db}button,a,select{background:#263447;color:#f1f5fb;border-color:#60718a}}
</style></head><body><main><section class="panel"><div class="bar"><h1>Casino & plis</h1><a href="../../../index.html">Hub</a><label data-options-exclude>Jeu <select id="mode"><option value="blackjack">21</option><option value="poker">Poker fermé</option><option value="tricks">Jeu de plis</option></select></label><label>Difficulté du bot <select id="botDifficulty"><option value="easy">Facile</option><option value="normal" selected>Moyen</option><option value="hard">Difficile</option><option value="expert">Extrême</option></select></label><label>Cartes par manche <select id="trickCards"><option value="5">5</option><option value="7" selected>7</option><option value="9">9</option></select></label><label><input id="dealerSoft17" type="checkbox"> Banque tire sur 17 souple</label><button id="newGame" class="primary">Nouvelle manche</button></div><div class="layout"><section><div id="status" class="status"></div><div class="table"><div class="zone"><strong id="opponentLabel">Banque</strong><div id="opponent" class="hand"></div><p id="opponentScore"></p></div><div class="zone"><strong id="tableLabel">Table</strong><div id="table" class="hand"></div></div><div class="zone"><strong>Votre main</strong><div id="player" class="hand"></div><p id="playerScore"></p></div></div><div class="actions"><button id="draw">Piocher</button><button id="stand">Rester / jouer</button><button id="replace">Remplacer la sélection</button></div></section><aside class="side panel"><h2 id="title"></h2><p id="description" class="muted"></p><p id="score" class="score"></p><h2>Règles</h2><ul id="rules" class="rules"></ul></aside></div></section></main><script src="../../../shared/game-runtime.js?v=12"></script><script src="casino-plis.js?v=2"></script><script src="../../../shared/records.js?v=7"></script><script src="../../../shared/options-help.js?v=4" data-options-help="true"></script></body></html>
