<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bataille Corse</title>
  <style>
    :root{color-scheme:light dark;font-family:Arial,sans-serif;background:#f3f6fb;color:#152238}body{margin:0;min-height:100vh}main{max-width:1080px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #d7e0ed;border-radius:16px;padding:18px;box-shadow:0 8px 24px #0002}.toolbar,.actions{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}.toolbar{justify-content:flex-start;margin-top:0}h1{margin:0 auto 0 0}button,a,select{border:1px solid #9baac0;border-radius:10px;padding:9px 13px;background:#fff;color:#152238;font:inherit;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#2447a8;border-color:#2447a8;color:#fff}button:disabled{opacity:.55;cursor:not-allowed}.muted{color:#61718a;font-size:14px}.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}.score{min-height:145px;padding:10px;border:1px solid #d7e0ed;border-radius:12px;background:#f8fafc;text-align:center;display:grid;grid-template-rows:auto 1fr auto;place-items:center}.score.active{box-shadow:inset 0 0 0 3px #60a5fa}.score.winner{animation:score-win .75s ease-out}.mini-stack{position:relative;width:72px;height:calc(96px + var(--stack-offset,0px));margin:5px auto}.mini-stack.empty{border:2px dashed #9baac0;border-radius:9px}.mini-layer{position:absolute;width:68px;height:94px;box-sizing:border-box;border:1px solid #203048;border-radius:8px;background:repeating-linear-gradient(45deg,#294c9c,#294c9c 6px,#e7efff 6px,#e7efff 12px)}.score strong{font-size:14px}#pile{min-height:205px;display:flex;align-items:center;justify-content:center;position:relative;margin:20px auto;max-width:520px}.card{width:104px;height:148px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;padding:10px;border:2px solid #203048;border-radius:12px;background:#fff;box-shadow:3px 4px 0 #2030482e;color:#17243a;font-size:26px;text-align:left}.card strong{align-self:center;font-size:58px;line-height:1}.card.red{color:#c8263f}.card.back{display:grid;place-items:center;background:repeating-linear-gradient(-45deg,#173f91,#173f91 8px,#dbeafe 8px,#dbeafe 16px);color:#fff;font-size:34px}.pile-card{position:absolute;width:104px;height:148px;transform:translate(var(--offset-x),var(--offset-y)) rotate(var(--rotation));transform-style:preserve-3d}.flip-card{position:absolute;inset:0;perspective:700px}.flip-inner{position:absolute;inset:0;transform-style:preserve-3d}.pile-card.newest .flip-inner{animation:turn-card-vertical .62s cubic-bezier(.2,.75,.25,1) forwards}.card-face{position:absolute;inset:0;backface-visibility:hidden}.card-face.front{transform:rotateX(180deg)}.pile-card:not(.newest) .flip-inner,.capture .flip-inner{transform:rotateX(180deg)}.outcome-icon{position:absolute;z-index:15;inset:42px 25px auto;display:grid;place-items:center;width:54px;height:54px;border-radius:50%;color:#fff;font-size:37px;font-weight:900;opacity:0;animation:show-outcome .38s .15s ease-out forwards}.lost .outcome-icon{background:#b91c1ce8;box-shadow:0 0 0 7px #fca5a577}.won .outcome-icon{background:#15803de8;box-shadow:0 0 0 7px #86efac77}.capture.lost{animation:lost-card .58s ease-out}.capture.won{animation:won-card .72s ease-out}.capture-count{position:absolute;z-index:30;right:8px;bottom:0;padding:6px 10px;border-radius:999px;background:#17243a;color:#fff;font-weight:800}.slap-burst{position:absolute;z-index:40;display:grid;place-items:center;width:118px;height:118px;border-radius:50%;background:#a21cafdd;color:#fff;font-size:58px;box-shadow:0 0 0 12px #e879f955;animation:slap-burst .75s ease-out forwards}.slap-burst.bad{background:#b91c1cdd;box-shadow:0 0 0 12px #fca5a566}.empty-pile{width:104px;height:148px;display:grid;place-items:center;border:2px dashed #9baac0;border-radius:12px}#status{min-height:26px;text-align:center;font-weight:700}#history{color:#53647d;line-height:1.5;padding-left:22px}.primary{background:#2447a8;border-color:#2447a8;color:#fff}.slap{background:#a21caf;border-color:#a21caf;color:#fff}@keyframes turn-card-vertical{0%{transform:rotateX(0)}48%{transform:rotateX(86deg) scale(.97)}100%{transform:rotateX(180deg)}}@keyframes show-outcome{from{opacity:0;transform:scale(.3) rotate(-20deg)}to{opacity:1;transform:scale(1)}}@keyframes lost-card{30%{transform:translate(var(--offset-x),var(--offset-y)) rotate(calc(var(--rotation) - 3deg))}55%{filter:saturate(.55) brightness(.78)}}@keyframes won-card{50%{transform:translate(var(--offset-x),calc(var(--offset-y) - 13px)) rotate(var(--rotation));filter:drop-shadow(0 0 9px #22c55e)}}@keyframes slap-burst{0%{opacity:0;transform:scale(2.1) rotate(-18deg)}35%{opacity:1;transform:scale(.86) rotate(8deg)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}@keyframes score-win{50%{transform:scale(1.05);background:#dcfce7}}@media(prefers-color-scheme:dark){:root{background:#101827;color:#e8eef8}.panel{background:#172235;border-color:#34445e;box-shadow:0 8px 24px #0005}button,a,select{background:#263447;border-color:#60718a;color:#f1f5fb}.score{background:#1f2c3e;border-color:#40516a}.muted,#history{color:#b5c1d1}.card{background:#eef4fd}}
  </style>
</head>
<body>
  <main><section class="panel">
    <div class="toolbar"><h1>Bataille Corse</h1><a href="../../../index.html">Hub de jeux</a><button id="newGame">Nouvelle partie</button><label class="muted">Joueurs <select id="playerCount"><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label><label class="muted">Joueur 2 <select id="opponent"><option value="human">Humain local</option><option value="easy">Bot facile</option><option value="normal" selected>Bot moyen</option><option value="hard">Bot difficile</option></select></label><label class="muted"><input id="slapOnSeven" type="checkbox"> Taper sur les 7</label><label class="muted"><input id="slapOnTenSandwich" type="checkbox"> Sandwich de 10</label></div>
    <p class="muted">Les cartes restent visibles pendant l’attribution du tas. Une croix rouge indique les cartes des perdants.</p>
    <div id="scores" class="scores"></div><div id="status" class="muted"></div><div id="pile" aria-label="Tas central"></div><div id="actions" class="actions"></div><ul id="history" aria-live="polite"></ul>
  </section></main>
  <script src="../../../shared/cards.js?v=18"></script><script src="bataille-corse.js?v=6"></script>
</body>
</html>
