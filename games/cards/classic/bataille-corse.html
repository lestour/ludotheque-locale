<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bataille Corse</title>
<style>
:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#f3f6fb;color:#152238}body{margin:0;min-height:100vh}main{max-width:980px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #d7e0ed;border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.08)}.toolbar,.actions{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}.toolbar{justify-content:flex-start;margin-top:0}h1{margin:0 auto 0 0}button,a,select{border:1px solid #9baac0;border-radius:10px;padding:9px 13px;background:#fff;color:#152238;font:inherit;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#2447a8;border-color:#2447a8;color:#fff}button:disabled{opacity:.55;cursor:not-allowed}.muted{color:#61718a;font-size:14px}.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:20px 0}.score{padding:12px;border:1px solid #d7e0ed;border-radius:12px;background:#f8fafc;text-align:center}.score strong{display:block;font-size:28px}#pile{min-height:175px;display:flex;align-items:center;justify-content:center;position:relative;margin:20px auto;max-width:360px}.card{width:104px;height:148px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;padding:10px;border:2px solid #203048;border-radius:12px;background:#fff;box-shadow:3px 4px 0 rgba(32,48,72,.18);color:#17243a;font-size:26px;text-align:left}.card strong{align-self:center;font-size:58px;line-height:1}.card.red{color:#c8263f}.pile-card{position:absolute;transform:translateX(var(--offset));transform-style:preserve-3d}.pile-card.newest .card{animation:flip-vertical .42s ease-out}@keyframes flip-vertical{0%{transform:rotateX(90deg);opacity:.2}55%{transform:rotateX(-9deg)}100%{transform:rotateX(0);opacity:1}}#status{min-height:26px;text-align:center;font-weight:700}#history{color:#53647d;line-height:1.5;padding-left:22px}.primary{background:#2447a8;border-color:#2447a8;color:#fff}.slap{background:#a21caf;border-color:#a21caf;color:#fff}@media(prefers-color-scheme:dark){:root{background:#101827;color:#e8eef8}.panel{background:#172235;border-color:#34445e;box-shadow:0 8px 24px rgba(0,0,0,.3)}button,a,select{background:#263447;border-color:#60718a;color:#f1f5fb}.score{background:#1f2c3e;border-color:#40516a}.muted,#history{color:#b5c1d1}.card{background:#eef4fd}}</style></head>
<body><main><section class="panel"><div class="toolbar"><h1>Bataille Corse</h1><a href="../../../index.html">Hub de jeux</a><button id="newGame">Nouvelle partie</button><label class="muted">Joueurs <select id="playerCount"><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label><label class="muted">Joueur 2 <select id="opponent"><option value="human">Humain local</option><option value="easy">Bot facile</option><option value="normal" selected>Bot moyen</option><option value="hard">Bot difficile</option></select></label><label class="muted"><input id="slapOnSeven" type="checkbox"> Taper sur les 7</label><label class="muted"><input id="slapOnTenSandwich" type="checkbox"> Sandwich de 10</label></div><p class="muted">À plus de deux joueurs, la partie est locale ; le bot reste disponible pour une partie à deux. Valet, Dame, Roi et As imposent respectivement 1, 2, 3 et 4 tentatives.</p><div id="scores" class="scores"></div><div id="status" class="muted"></div><div id="pile" aria-label="Tas central"></div><div id="actions" class="actions"></div><ul id="history" aria-live="polite"></ul></section></main><script src="../../../shared/cards.js?v=17"></script><script src="bataille-corse.js?v=5"></script></body></html>
