<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dernière Couleur</title><style>
:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#f3f6fb;color:#152238}body{margin:0;min-height:100vh}main{max-width:1120px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #d7e0ed;border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.08)}.toolbar,.rules,.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}h1{margin:0 auto 0 0}button,a,select{font:inherit;color:inherit;background:#fff;border:1px solid #9baac0;border-radius:10px;padding:8px 11px;cursor:pointer;text-decoration:none}button:hover,a:hover{background:#2447a8;color:#fff}button:disabled{opacity:.55;cursor:not-allowed}.muted{color:#61718a;font-size:14px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.player{border:1px solid #d7e0ed;border-radius:12px;padding:10px;text-align:center}.player.active{outline:3px solid #efab24}.card{width:94px;height:132px;box-sizing:border-box;border:3px solid #203048;border-radius:12px;background:#fff;color:#17243a;padding:7px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;font-weight:700;font-size:21px}.card strong{align-self:center;font-size:30px}.card.red{background:#e84142;color:#fff}.card.yellow{background:#f4c430}.card.green{background:#32a55d;color:#fff}.card.blue{background:#3979d8;color:#fff}.card.wild{background:conic-gradient(#e84142 0 25%,#f4c430 0 50%,#32a55d 0 75%,#3979d8 0);color:#fff}.center{display:flex;justify-content:center;align-items:center;gap:25px;margin:24px}.deck{width:94px;height:132px;border-radius:12px;border:3px solid #203048;background:repeating-linear-gradient(45deg,#172d68,#172d68 8px,#f1f5ff 8px,#f1f5ff 16px);color:#fff;font-size:20px}.hand{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.hand .card{cursor:pointer}.hand .card.playable{outline:4px solid #a855f7;outline-offset:2px}.log{line-height:1.5;color:#53647d}@media(prefers-color-scheme:dark){:root{background:#101827;color:#e8eef8}.panel,.player{background:#172235;border-color:#34445e}.muted,.log{color:#b5c1d1}button,a,select{background:#263447;color:#f1f5fb}}</style></head><body><main><section class="panel"><div class="toolbar"><h1>Dernière Couleur</h1><a href="../../../index.html">Hub de jeux</a><button id="newGame">Nouvelle partie</button><label class="muted">Joueurs <select id="playerCount"><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label><label class="muted">Bots <select id="difficulty"><option value="easy">Faciles</option><option value="normal" selected>Moyens</option><option value="hard">Difficiles</option></select></label></div><div class="rules"><strong>Règles :</strong><label><input id="stacking" type="checkbox"> empiler +2/+4</label><label><input id="sevenZero" type="checkbox"> 7-0</label><label><input id="jumpIn" type="checkbox"> jump-in</label><label><input id="drawUntil" type="checkbox"> piocher jusqu’à jouable</label><label><input id="strictFour" type="checkbox" checked> +4 strict/challenge</label><label><input id="announcementPenalty" type="checkbox" checked> pénalité d’annonce</label></div><div id="status" class="muted"></div><div id="players" class="players"></div><div class="center"><button id="deck" class="deck">PIOCHE</button><div id="discard"></div><label class="muted">Couleur <select id="color"><option value="red">Rouge</option><option value="yellow">Jaune</option><option value="green">Vert</option><option value="blue">Bleu</option></select></label></div><div class="actions"><button id="draw">Piocher</button><button id="announceLastCard">Annoncer dernière carte !</button><button id="contestAnnouncement" hidden>Contester l’oubli</button><button id="challenge" hidden>Contester +4</button></div><h2>Votre main</h2><div id="hand" class="hand"></div><ul id="log" class="log"></ul></section></main><script src="../../../shared/game-runtime.js?v=1"></script><script src="derniere-couleur.js?v=5"></script><script src="../../../shared/records.js?v=3"></script></body></html>
