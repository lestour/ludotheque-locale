<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roi Pirate</title><style>:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#edf3fb;color:#17243a}body{margin:0}main{max-width:1180px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #d7e0ed;border-radius:17px;padding:18px;box-shadow:0 8px 24px #0002}.bar,.hand,.bids,.trick{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}h1{margin:0 auto 0 0}button,a,select{font:inherit;background:#fff;color:inherit;border:1px solid #9baac0;border-radius:9px;padding:8px 11px;cursor:pointer;text-decoration:none}button:hover,a:hover{background:#1d4ed8;color:#fff}.muted{color:#61718a}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.player{padding:11px;border:1px solid #d7e0ed;border-radius:11px;background:#f8fafc}.player.active{outline:3px solid #eab308}.card{width:94px;min-height:108px;border:3px solid #2447a8;border-radius:11px;background:#fff;color:#17243a;font-weight:800;padding:7px;cursor:pointer}.card:hover{transform:translateY(-6px);color:#17243a}.card.red{border-color:#dc2626}.card.blue{border-color:#2563eb}.card.yellow{border-color:#ca8a04}.card.black{border-color:#111827}.card.special{background:#ffedd5;border-color:#c2410c}.trick{min-height:125px;justify-content:center;background:#e2e8f0;border-radius:12px}@media(prefers-color-scheme:dark){:root{background:#101827;color:#e8eef8}.panel,.player{background:#172235;border-color:#34445e}.muted{color:#b5c1d1}button,a,select{background:#263447;color:#f1f5fb}.card{background:#f8fafc;color:#17243a;border-color:#94a3b8}.trick{background:#0f172a}}</style></head><body><main><section class="panel"><div class="bar"><h1>Roi Pirate</h1><a href="../../../index.html">Hub</a><button id="newGame">Nouvelle partie</button><label class="muted">Joueurs <select id="players"><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option></select></label></div><p id="status" class="muted"></p><div id="bids" class="bids"></div><div id="people" class="players"></div><h2>Le pli</h2><div id="trick" class="trick"></div><h2>Votre main</h2><div id="hand" class="hand"></div><p id="rules" class="muted">Faites votre enchère avant chaque manche. Les cartes spéciales restent toujours jouables. Noir est l’atout ; Corsaires, Roi Pirate et Oracles suivent leur hiérarchie. Les bonus ne comptent que si l’enchère est exacte.</p></section></main><script src="roi-pirate.js?v=4"></script></body></html>
