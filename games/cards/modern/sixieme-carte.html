<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sixième Carte</title><style>
:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#f3f6fb;color:#152238}body{margin:0}main{max-width:1160px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #d7e0ed;border-radius:16px;padding:18px;box-shadow:0 8px 24px #00000014}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}h1{margin:0 auto 0 0}button,a,select{font:inherit;color:inherit;background:#fff;color:#152238;border:1px solid #9baac0;border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none}button:hover,a:hover{background:#2447a8;color:#fff}.muted,#log{color:#61718a;line-height:1.5}.rows{display:grid;gap:9px;margin:22px 0}.row{display:flex;gap:6px;min-height:72px;padding:7px;border:1px solid #d7e0ed;border-radius:10px;background:#f8fafc}.card{width:58px;height:66px;border:2px solid #203048;border-radius:9px;background:#fff;color:#17243a;font-size:22px;font-weight:800;position:relative}.card small{position:absolute;right:4px;bottom:3px;font-size:12px;color:#c2410c}.hand{display:flex;gap:8px;flex-wrap:wrap}.hand .card{cursor:pointer}.hand .card:hover{transform:translateY(-5px);outline:3px solid #7c3aed}.scores{display:flex;gap:10px;flex-wrap:wrap}.score{padding:8px 12px;border:1px solid #d7e0ed;border-radius:9px}@media(prefers-color-scheme:dark){:root{background:#101827;color:#e8eef8}.panel,.row{background:#172235;border-color:#34445e}.muted,#log{color:#b5c1d1}button,a,select{background:#263447;color:#f1f5fb}.card{background:#eef4fd}}</style></head><body><main><section class="panel"><div class="toolbar"><h1>Sixième Carte</h1><a href="../../../index.html">Hub de jeux</a><button id="newGame">Nouvelle partie</button><label class="muted">Joueurs <select id="players"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></label><label class="muted">Fin <select id="limit"><option value="66">66 têtes</option><option value="100">100 têtes</option></select></label></div><div id="status" class="muted"></div><div id="scores" class="scores"></div><div id="rows" class="rows"></div><h2>Votre main</h2><div id="hand" class="hand"></div><ul id="log"></ul></section></main><script src="../../../shared/game-runtime.js?v=1"></script><script src="sixieme-carte.js?v=4"></script><script src="../../../shared/records.js?v=3"></script></body></html>
