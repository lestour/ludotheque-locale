<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatastrophe</title>
<style>
:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#fff5f5;color:#3f1420}body{margin:0}main{max-width:1180px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #f3c4cf;border-radius:18px;padding:18px;box-shadow:0 8px 24px #0002}.bar,.hand,.targets,.future{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}h1{margin:0 auto 0 0}button,a,select{font:inherit;background:#fff;color:inherit;border:1px solid #bd7185;border-radius:9px;padding:8px 11px;cursor:pointer;text-decoration:none}button:hover,a:hover{background:#be123c;color:#fff}.muted,#log{color:#8d5362;line-height:1.5}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.player{padding:11px;border:1px solid #f3c4cf;border-radius:11px;background:#fff8fa}.player.active{outline:3px solid #f59e0b}.draw-zone{margin-top:52px;padding-top:24px;border-top:2px solid #f3c4cf}.card{width:120px;min-height:108px;border:3px solid #be123c;border-radius:12px;background:#fff;color:#3f1420;font-weight:800;padding:8px;cursor:pointer;text-align:left}.card:hover{transform:translateY(-6px)}.deck{width:108px;height:128px;background:repeating-linear-gradient(45deg,#be123c 0 8px,#fda4af 8px 16px);color:#fff;text-align:center;font-weight:900}.danger{border-color:#7f1d1d;background:#fee2e2}.future .card{min-height:64px;width:84px}.modal{border:0;border-radius:14px;padding:18px;max-width:390px;background:#fff;color:#3f1420;box-shadow:0 12px 32px #0005}.modal::backdrop{background:#0008}@media(prefers-color-scheme:dark){:root{background:#21121b;color:#ffeef2}.panel,.player{background:#321927;border-color:#6e3949}.muted,#log{color:#e5aab7}button,a,select,.card,.modal{background:#482131;color:#ffeef2}.draw-zone{border-color:#6e3949}.danger{background:#5d1f28}.modal{color:#ffeef2}}
</style></head><body><main><section class="panel"><div class="bar"><h1>Chatastrophe</h1><a href="../../../index.html">Hub</a><button id="newGame">Nouvelle partie</button><label class="muted">Joueurs <select id="players"><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label></div><p id="status" class="muted"></p><div id="playersView" class="players"></div><div class="bar draw-zone"><button id="draw" class="deck">PIOCHER</button><span id="discard" class="muted">Défausse vide</span></div><div id="future" class="future"></div><h2>Votre main</h2><div id="hand" class="hand"></div><div id="targets" class="targets"></div><ul id="log"></ul></section></main><dialog id="defuseDialog" class="modal"><h2>Protection activée !</h2><p>L’incident félin retourne dans la pioche. Choisissez sa position.</p><button data-place="top">Au-dessus</button><button data-place="middle">Au milieu</button><button data-place="bottom">En dessous</button></dialog><script src="../../../shared/game-runtime.js?v=1"></script><script src="chatastrophe.js?v=5"></script><script src="../../../shared/records.js?v=3"></script></body></html>
