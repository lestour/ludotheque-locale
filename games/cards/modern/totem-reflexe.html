<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Totem Réflexe</title>
  <style>
    :root{color-scheme:light dark;font-family:Arial,sans-serif;background:#f3f6fb;color:#152238}body{margin:0;min-height:100vh}main{max-width:950px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #d7e0ed;border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.08)}.toolbar,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}h1{margin:0 auto 0 0}button,a,select{font:inherit;color:inherit;background:#fff;border:1px solid #9baac0;border-radius:10px;padding:9px 13px;cursor:pointer;text-decoration:none}button:hover,a:hover{background:#2447a8;color:#fff}button:disabled{opacity:.55;cursor:not-allowed}.muted{color:#61718a;font-size:14px}.board{display:grid;grid-template-columns:1fr 190px 1fr;gap:22px;align-items:center;margin:25px 0}.player{text-align:center;font-weight:700}.card{width:170px;height:230px;margin:10px auto;border:3px solid #203048;border-radius:15px;background:#fff;box-shadow:4px 5px 0 rgba(32,48,72,.18);display:grid;place-items:center;font-size:94px}.card.back{background:repeating-linear-gradient(45deg,#294c9c,#294c9c 9px,#e7efff 9px,#e7efff 18px);color:#fff}.card.duel{outline:5px solid #efab24}.totem{width:138px;height:138px;border-radius:50% 50% 45% 45%;border:0;background:linear-gradient(90deg,#e15b27,#f7b434);box-shadow:0 8px 0 #9b3b19;color:#fff;font-size:28px;font-weight:700}.totem.duel{animation:pulse .4s infinite alternate}@keyframes pulse{to{transform:scale(1.09);box-shadow:0 0 0 8px #fde68a}}.count{font-size:28px}.log{line-height:1.6;color:#53647d}@media(prefers-color-scheme:dark){:root{background:#101827;color:#e8eef8}.panel{background:#172235;border-color:#34445e}.card{background:#eef4fd}.muted,.log{color:#b5c1d1}button,a,select{background:#263447;color:#f1f5fb}}
  </style>
</head>
<body>
  <main><section class="panel">
    <div class="toolbar"><h1>Totem Réflexe</h1><a href="../../../index.html">Hub de jeux</a><button id="newGame">Nouvelle partie</button><label class="muted">Bot <select id="difficulty"><option value="easy">Facile</option><option value="normal" selected>Moyen</option><option value="hard">Difficile</option></select></label></div>
    <p class="muted">Retournez votre carte. Quand deux symboles sont identiques, attrapez le totem avant votre adversaire.</p>
    <div id="status" class="muted"></div>
    <div class="board"></div>
    <div class="actions"><button id="flip">Retourner votre carte</button><button id="slap">Attraper le totem</button></div>
    <ul id="log" class="log"></ul>
  </section></main>
  <script src="../../../shared/game-runtime.js?v=8"></script>
  <script src="../../../shared/cards.js?v=18"></script>
  <script src="totem-reflexe.js?v=7"></script>
  <script src="../../../shared/records.js?v=3"></script>
  <script src="../../../shared/options-help.js?v=3" data-options-help="true"></script>
</body>
</html>
