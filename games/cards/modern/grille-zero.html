<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Grille Zéro</title><style>
:root{color-scheme:light dark;font-family:Arial,sans-serif;background:#f3f6fb;color:#152238}body{margin:0}main{max-width:1220px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #d7e0ed;border-radius:16px;padding:18px;box-shadow:0 8px 24px #00000014}.toolbar,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}h1{margin:0 auto 0 0}button,a,select{font:inherit;color:inherit;background:#fff;color:#152238;border:1px solid #9baac0;border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none}button:hover,a:hover{background:#2447a8;color:#fff}button:disabled{opacity:.5}.muted,#log{color:#61718a;line-height:1.5}.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}.table{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.player{padding:12px;border:1px solid #d7e0ed;border-radius:12px;background:#f8fafc}.player.active{outline:3px solid #efab24}.grid{display:grid;grid-template-columns:repeat(4,54px);gap:5px;justify-content:center;margin:9px}.card{height:69px;padding:0;border:2px solid #203048;border-radius:8px;background:#fff;display:grid;place-items:center;font-size:25px;font-weight:800;color:#17243a}.card.negative{color:#0f766e}.card.back{background:repeating-linear-gradient(45deg,#0f766e,#0f766e 8px,#d9f99d 8px,#d9f99d 16px);color:#fff}.card.removed{visibility:hidden}.card.selectable{outline:4px solid #a855f7;cursor:pointer}.center{display:flex;justify-content:center;align-items:center;gap:20px;margin:18px}.pile{width:96px;height:126px;border:3px solid #203048;border-radius:12px;display:grid;place-items:center;font-size:30px;font-weight:800;background:repeating-linear-gradient(45deg,#0f766e,#0f766e 8px,#d9f99d 8px,#d9f99d 16px);color:#fff}.discard{background:#fff;color:#17243a}.pending{outline:5px solid #f59e0b}@media(max-width:800px){.layout{grid-template-columns:1fr}}@media(prefers-color-scheme:dark){:root{background:#101827;color:#e8eef8}.panel,.player{background:#172235;border-color:#34445e}.muted,#log{color:#b5c1d1}button,a,select{background:#263447;color:#f1f5fb}.card.discard{background:#eef4fd}}
</style></head><body><main><section class="panel"><div class="toolbar"><h1>Grille Zéro</h1><a href="../../../index.html">Hub de jeux</a><button id="newGame">Nouvelle partie</button><label class="muted">Joueurs <select id="players"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option></select></label><label class="muted">Score final <select id="limit"><option value="100">100</option><option value="200">200</option></select></label></div><div class="toolbar"><label><input id="columns" type="checkbox" checked> retirer les colonnes de 3 identiques</label><label><input id="doubleFinish" type="checkbox" checked> doubler le score du finisseur s’il n’est pas le plus bas</label></div><div id="status" class="muted"></div><div class="layout"><div><div id="table" class="table"></div><div class="center"><button id="deck" class="pile">PIOCHE</button><button id="discard" class="pile discard">—</button></div><div class="actions"><button id="discardDraw" hidden>Défausser et révéler une carte</button></div><ul id="log"></ul></div><aside><h2>Scores</h2><div id="scores" class="muted"></div><p class="muted">Prenez la défausse ou piochez. Une carte piochée peut remplacer une carte, ou être défaussée pour révéler une carte cachée.</p></aside></div></section></main><script src="grille-zero.js?v=3"></script></body></html>
